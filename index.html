<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olimpíadas IN-NOVA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213d;--mute:#5b6781;--line:#d8dfeb;--soft:#e9eef6;--t0:#3d9ad8;--t1:#c8283a;--t2:#d99a00;--t3:#2c4bc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#172034;--ink:#e9eefa;--mute:#98a6c3;--line:#2a3652;--soft:#202b44}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#172034;--ink:#e9eefa;--mute:#98a6c3;--line:#2a3652;--soft:#202b44}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden;width:100%}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:20px 12px 48px;overflow-x:hidden}
header{text-align:center}
header h1{font-size:clamp(24px,6vw,46px);font-weight:800;letter-spacing:-.02em}
header h1 a{color:inherit;text-decoration:none}
header p{margin:6px 0 0;color:var(--mute);font-size:14px}
#tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0}
#tabs:empty{margin:10px 0}
#tabs a,.chipbtn{font:600 14px Figtree,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
#tabs a[aria-current=page],.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--t0);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;overflow:hidden}
.panel h2{font-size:20px;margin-bottom:12px;text-align:center}
.panel>p{text-align:center}
.race{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}
.rpos{font:800 24px 'Bricolage Grotesque',sans-serif;color:var(--mute);text-align:center}
.rname{font-weight:600;margin-bottom:4px;font-size:15px}
.bar{height:20px;border-radius:6px;background:var(--c);transform-origin:left;min-width:4px}
.grow .bar{animation:g .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes g{from{transform:scaleX(0)}}
.rpts{font:800 22px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:100%}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute)}
tfoot td{font-weight:800;border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.acts{display:grid;gap:8px}
.act{display:grid;grid-template-columns:1fr repeat(3,auto);gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.act small{display:block;color:var(--mute)}
.act>div:first-child a{color:inherit;text-decoration:none}
.cell{border:1px dashed var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:6px 4px;min-width:70px;text-align:center;font:600 12px Figtree,sans-serif;text-decoration:none;display:block}
.cell:hover{border-color:var(--ink)}
.cell.done{border-style:solid}
.cell span.l{display:block;color:var(--mute);margin-bottom:2px;font-size:10px}
.chip{display:inline-block;min-width:18px;padding:1px 4px;margin:0 1px;border-radius:4px;background:var(--c);color:#fff;font-weight:800;font-size:11px}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
input,select{font:inherit;font-size:14px;min-height:40px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;max-width:100%}
input[type=number]{width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0}
.row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px;width:100%}

.marca-header{
 display:grid;
 grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr) 76px 30px;
 gap:6px;
 font-weight:600;
 font-size:13px;
 color:var(--mute);
 margin-bottom:6px;
 padding:0 2px;
 align-items:center;
}
.marca-header span{text-align:center;width:100%;display:block}
.marca-row{
 display:grid;
 grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr) 76px 30px;
 gap:6px;
 align-items:center;
 margin-bottom:8px;
 width:100%;
}
.marca-row input, .marca-row select{
 font-size:13px;
 padding:6px 4px;
 min-height:38px;
 width:100%;
 min-width:0;
 box-sizing:border-box;
}
.marca-row input.input-tempo{text-align:center;font-weight:600;padding:6px 2px}
.btn-del{
 width:30px;
 height:38px;
 min-height:38px;
 padding:0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 font-weight:700;
 border-radius:8px;
}

.btn{font:600 14px Figtree,sans-serif;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn.alt{background:none;color:var(--ink)}
.btn.warn{background:none;color:var(--t1);border-color:var(--t1)}
.match{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.match h3{font-size:15px;margin-bottom:10px;text-align:center}
.muted{color:var(--mute);text-align:center;font-size:13px}
.pv{margin-top:12px;padding:10px;background:var(--soft);border-radius:10px}
.pv div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.back{display:inline-block;margin-bottom:10px;color:var(--ink);font-weight:600;font-size:14px}
.ptitle{font-size:clamp(20px,5vw,32px);font-weight:800}
.page-head{text-align:center}
.st{display:inline-flex;align-items:center;gap:4px}
.st input{width:46px;text-align:center;padding:6px 2px}
.sb{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:700 18px/1 Figtree,sans-serif;cursor:pointer}
button:disabled,input:disabled,select:disabled{opacity:.45;cursor:not-allowed}
.ok{color:#1f9d55;font-weight:600;font-size:14px}
.catnav{margin:10px 0 14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.catnav a{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:600;text-decoration:none;min-height:38px;display:inline-flex;align-items:center;font-size:13px}
.catnav a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;justify-items:center;text-align:center}
.side{display:grid;gap:6px;justify-items:center;width:100%}
.side select,.side strong{max-width:100%;width:100%;text-align:center;font-size:13px}
.x{font-weight:800;padding-top:8px}

@media (prefers-reduced-motion:reduce){.grow .bar{animation:none}}
@media (max-width:620px){
 .wrap{padding:10px 8px 32px}
 .panel{padding:12px;border-radius:12px}
 .rpts{font-size:18px}
 .rrow{grid-template-columns:24px 1fr auto}
 .act{grid-template-columns:repeat(3,1fr)}
 .act>div:first-child{grid-column:1/-1;text-align:center}
 .cell{padding:6px 2px;min-width:0}
 table{min-width:100%}
 th,td{padding:6px 4px;font-size:13px}
 .marca-header, .marca-row {
  grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr) 68px 28px;
  gap:4px;
 }
 .marca-header {font-size:11px}
 .marca-row input, .marca-row select {font-size:12px;padding:5px 2px}
 .btn-del {width:28px}
}
@media (max-width:380px){.st{gap:2px}.sb{width:34px;height:34px}.st input{width:38px}}
/* Editor de modalidades */
.me-row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto auto;gap:6px;align-items:center;margin-bottom:8px}
.me-row.novo{grid-template-columns:minmax(0,1fr) 150px auto}
.me-row input,.me-row select{min-width:0}
.me-grupo{font-size:15px;margin:18px 0 8px}
.me-grupo span{color:var(--mute);font-weight:400;font-size:13px}
.me-reg{border-color:var(--line);font-size:16px}
.me-reg.on{border-color:var(--ink);background:var(--soft)}
@media (max-width:620px){.me-row{grid-template-columns:minmax(0,1fr) 110px auto auto}.me-row.novo{grid-template-columns:minmax(0,1fr) 110px auto}}

/* Janela do regulamento */
.reg-dlg{border:1px solid var(--line);border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink);overflow:hidden}
.reg-dlg::backdrop{background:rgba(10,15,30,.55)}
.reg-box{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.reg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.reg-head h2{font-size:18px}
.reg-body{padding:16px;overflow:auto;white-space:pre-wrap;line-height:1.6;font-size:15px}
.reg-body textarea{width:100%;min-height:50vh;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.reg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
</style>

<body>
<div class="wrap">
<header><h1><a href="#/">Olimpíadas IN-NOVA 2026</a></h1><p id="sub"></p></header>
<nav id="tabs" aria-label="Seções"></nav>
<main id="main"></main>
</div>
<script>
/* ==========================================================================
   1. CONSTANTES E ESTADO GLOBAL
   ========================================================================== */
const CATS = ['6º-7º ANO','8º ANO','9º EM'];
const L = {
 rank: ['Abertura Temática','Bandeira','Chamada','Escola Limpa','Fair Play','Grito de Paz','Mascote','Organização','Torcida','Uniforme','Torta Na Cara','The Voice'],
 chav: ['Basquetebol Misto','Kings League','FIFA','Futebol Society Masc','Futevôlei','Futmesa','Futsal Misto','Pique Bandeirinha','Queimada','Tênis Dupla Mista','Vôlei de Areia Fem','Vôlei de Areia Masc','Voleibol Quadra Fem','Voleibol Quadra Masc','Tênis de Mesa'],
 marca: ['Escalada','Natação Fem','Natação Masc','Pedal Kart','Prova do Balde (invertida)','Atletismo Masculino','Atletismo Feminino'],
 crit: ['Free Fire','Operações Matemáticas','Prova dos Sentidos','Soletrando','Ciências','Do Lixo ao Luxo','Master Chef'],
 pontos: ['Boliche Humano','Adedonha']
};
const TN = {chav:'Chaveamento',rank:'Ranking',marca:'Marca (tempo)',crit:'Critérios',pontos:'Pontuação'};
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
/* Lista padrão de modalidades (usada só enquanto nada foi salvo no servidor).
   O "id" é fixo: é ele que liga a modalidade aos resultados na tabela res. */
const MODS_PADRAO = Object.keys(L).flatMap(t => L[t].map(n => ({id: slug(n), n, t})));
let ACTS = [], BY = {};
const KEY = 'olimpiadas-in-nova-2026-v2';
const T = [0,1,2,3], D = {};

const fresh = () => ({teams:['Argentina','Portugal','Espanha','França'],pts:[200,150,100,80],fan:200,ig:100,res:{},fans:[],insta:[0,1,2,3].map(()=>Array(20).fill(false)),
 mods: JSON.parse(JSON.stringify(S && Array.isArray(S.mods) ? S.mods : MODS_PADRAO))});
let S; try { S = JSON.parse(localStorage.getItem(KEY)) } catch (e) {}
S = Object.assign(fresh(), S || {});

/* Monta ACTS e BY a partir da lista de modalidades salva */
function buildActs() {
 const lista = Array.isArray(S.mods) ? S.mods : MODS_PADRAO;
 ACTS = lista.filter(m => m && m.id && m.n && TN[m.t]).map(m => ({n: m.n, t: m.t, s: m.id, r: !!m.r}));
 BY = Object.fromEntries(ACTS.map(a => [a.s, a]));
}
buildActs();

/* Páginas do sistema: cada uma tem a sua própria URL (hash) */
const TABS = [
 ['placar','Placar geral','#/'],
 ['mod','Modalidades','#/modalidades'],
 ['insta','Instagram','#/instagram'],
 ['torc','Torcida famosa','#/torcida'],
 ['cfg','Configurações','#/configuracoes']
];
const ROUTES = {
 ...Object.fromEntries(TABS.map(([k,,h]) => [h, k])),
 '#/configuracoes/modalidades': 'modedit'   // página vinculada às Configurações
};

/* Colunas da tabela cfg que cada página precisa ler (requisição focada) */
const COLS = {
 placar:  'teams,pts,fan,ig,insta,fans,mods',
 mod:     'teams,pts,mods',
 m:       'teams,pts,mods',
 insta:   'teams,ig,insta',
 torc:    'teams,fan,fans',
 cfg:     'teams,pts,fan,ig,mods',
 modedit: 'mods'
};

let cur = null, curC = 0, pg = 'placar', flt = 'todas', first = true;
let navTok = 0, carregando = false, pendente = false;

/* Helper Utilities */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tn = i => esc(S.teams[i]);
const num = v => v===''||v==null||isNaN(+v)?null:+v;
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rk = (a, ci) => a.s+'|'+ci;
const view = k => D[k] || S.res[k] || {};
const ensureD = k => { if (!D[k]) D[k] = clone(S.res[k] || {}) };
function getPath(o, p) { return p.split('.').reduce((a,k) => a?.[k], o) }
function setPath(o, path, val) { const k = path.split('.'); for (let n=0; n<k.length-1; n++) { if (o[k[n]]==null) o[k[n]] = /^\d+$/.test(k[n+1]) ? [] : {}; o = o[k[n]] } o[k[k.length-1]] = val }

/* ==========================================================================
   2. MÓDULO SUPABASE E DE REQUISIÇÕES FOCADAS POR PÁGINA
   ========================================================================== */
const SUPABASE_URL = 'https://eeqahersokenqsmfwpfb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlcWFoZXJzb2tlbnFzbWZ3cGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjgyNjksImV4cCI6MjEwNjUwNDI2OX0.5oErD8Un5o15G3Vow6YMfgb1d6pJhXdudkKjG4sHxZs';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} };
const fail = e => alert('Não foi possível salvar no servidor: ' + (e && (e.message || e.code) || JSON.stringify(e)));

function parseId(id) {
 const parts = String(id || '').split('_');
 const ci = parts.pop();
 const a = BY[parts.join('_')];
 return a && ci != null ? rk(a, ci) : null;
}
function applyRes(id, d) { const k = parseId(id); if (k && d) S.res[k] = d; }
function removeRes(id) { const k = parseId(id); if (k) delete S.res[k]; }

function applyCfg(d) {
 if (!d) return;
 ['teams', 'pts', 'fan', 'ig', 'insta', 'fans', 'mods'].forEach(k => { if (d[k] != null) S[k] = d[k]; });
 if (d.mods != null) { buildActs(); syncCur(); }
}

const DB = {
 /* Lê somente as colunas de cfg que a página atual usa */
 async fetchCfg(cols) {
  if (!db) return;
  const { data, error } = await db.from('cfg').select(cols || '*').eq('id', 'geral');
  if (!error && data && data.length) applyCfg(data[0]);
 },

 /* Usado apenas pelo Placar geral e pela lista de Modalidades (somente leitura) */
 async fetchAllRes() {
  if (!db) return;
  const { data, error } = await db.from('res').select('*');
  if (error || !data) return;
  S.res = {};
  data.forEach(item => applyRes(item.id, item.d));
 },

 /* Usado pela página de uma modalidade/categoria específica */
 async fetchSingleRes(a, ci) {
  if (!db || !a) return;
  const docId = `${a.s}_${ci}`;
  const { data, error } = await db.from('res').select('*').eq('id', docId);
  if (error) return;
  if (data && data.length) applyRes(data[0].id, data[0].d);
  else delete S.res[rk(a, ci)];
 },

 /* Grava somente as colunas alteradas, logo após reler a versão mais recente do servidor.
    Assim, quem edita o Instagram não sobrescreve quem edita a Torcida ou as Configurações. */
 async patchCfg(cols, mutate) {
  try {
   if (db) {
    const { data, error } = await db.from('cfg').select(cols.join(',')).eq('id', 'geral');
    if (!error && data && data.length) applyCfg(data[0]);
   }
   mutate();
   save();
   if (!db) return;
   const payload = { id: 'geral' };
   cols.forEach(c => payload[c] = S[c]);
   const { error } = await db.from('cfg').upsert(payload);
   if (error) fail(error);
  } catch (e) { fail(e); }
 },

 /* Gravação completa: usada apenas ao zerar o sistema */
 async saveAllCfg() {
  save();
  if (!db) return;
  const payload = { id: 'geral', teams: S.teams, pts: S.pts, fan: S.fan, ig: S.ig, insta: S.insta, fans: S.fans };
  const { error } = await db.from('cfg').upsert(payload);
  if (error) fail(error);
 },

 async persistRes(a, ci) {
  save();
  if (!db || !a) return;
  const docId = `${a.s}_${ci}`;
  const payload = { id: docId, d: S.res[rk(a, ci)] || {} };
  const { error } = await db.from('res').upsert(payload);
  if (error) fail(error);
 },

 /* Tempo real focado: cada página escuta somente o que exibe */
 setupRealtime() {
  if (!db) return;
  db.removeAllChannels();
  const nome = cur ? `olimp-m-${cur.s}-${curC}` : `olimp-${pg}`;
  const ch = db.channel(nome);
  const onRes = p => {
   if (p.eventType === 'DELETE') { if (p.old && p.old.id) removeRes(p.old.id); }
   else if (p.new) applyRes(p.new.id, p.new.d);
   save(); softRender();
  };
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'cfg' }, p => {
   if (p.new && p.new.id) { applyCfg(p.new); save(); softRender(); }
  });
  if (cur) {
   ch.on('postgres_changes', { event: '*', schema: 'public', table: 'res', filter: `id=eq.${cur.s}_${curC}` }, onRes);
  } else if (pg === 'placar' || pg === 'mod') {
   ch.on('postgres_changes', { event: '*', schema: 'public', table: 'res' }, onRes);
  }
  ch.subscribe();
 }
};

/* Evita redesenhar a tela enquanto alguém está digitando ou com rascunho aberto */
const hasDraft = () => cur && !!D[rk(cur, curC)];
const typing = () => {
 const a = document.activeElement;
 return !!a && $('main').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox';
};
const softRender = () => {
 if (carregando) return;
 if (hasDraft()) return;
 if (typing()) { pendente = true; return; }
 render();
};
document.addEventListener('focusout', () => setTimeout(() => {
 if (pendente && !typing()) { pendente = false; softRender(); }
}, 0));

/* ==========================================================================
   3. REGRAS DE NEGÓCIO E CÁLCULO
   ========================================================================== */
function crank(vals, asc) {
 const ix = vals.map((v, i) => [v, i]).filter(x => x[0] != null); if (!ix.length) return null;
 const p = [null, null, null, null]; ix.forEach(([v, i]) => p[i] = 1 + ix.filter(([w]) => asc ? w < v : w > v).length); return p;
}
function ptime(s) {
 s = String(s || '').trim(); if (!s) return null;
 if (!/['’:]/.test(s)) return num(s.replace(',', '.'));
 const p = s.split(/['’:]/).map(Number); if (p.some(isNaN)) return null;
 return p.length == 2 ? p[0] * 60 + p[1] : p[0] * 60 + p[1] + (p[2] || 0) / 100;
}
function win(m) {
 if (!m || !m.ok || m.a === '' || m.b === '' || m.a == null || m.b == null) return null;
 const sa = num(m.sa), sb = num(m.sb); if (sa == null || sb == null) return null;
 let w; if (sa != sb) w = sa > sb; else { const da = num(m.da), db = num(m.db); if (da == null || db == null || da == db) return null; w = da > db }
 return w ? [+m.a, +m.b] : [+m.b, +m.a];
}
function chavM(d) {
 const m = d.m || {}, w1 = win(m.s1), w2 = win(m.s2);
 return {s1: m.s1 || {}, s2: m.s2 || {}, t3: {...m.t3, a: w1 ? w1[1] : '', b: w2 ? w2[1] : ''}, f: {...m.f, a: w1 ? w1[0] : '', b: w2 ? w2[0] : ''}};
}
function place(t, d) {
 if (!d) return null;
 if (t == 'chav') {
  const x = chavM(d), wf = win(x.f), wt = win(x.t3), p = [null, null, null, null];
  if (wf) { p[wf[0]] = 1; p[wf[1]] = 2 } if (wt) { p[wt[0]] = 3; p[wt[1]] = 4 }
  return p.some(v => v) ? p : null;
 }
 if (!d.ok) return null;
 if (t == 'rank') { const r = T.map(i => num(d.p?.[i]) || null); return r.some(x => x) ? r : null }
 if (t == 'pontos') return crank(T.map(i => num(d.v?.[i])), false);
 if (t == 'crit') return crank(T.map(i => { const c = d.c?.[i]; return c && c.some(x => x !== '' && x != null) ? c.reduce((a, b) => a + (+b || 0), 0) : null }), false);
 if (t == 'marca') {
  const b = [null, null, null, null];
  (d.e || []).forEach(e => { const s = ptime(e?.t); if (s != null && e.team !== '' && e.team != null) { const i = +e.team; if (b[i] == null || s < b[i]) b[i] = s } });
  return crank(b, true);
 }
}
const ready = (t, d) => { const p = place(t, {...d, ok: true}); return t == 'marca' ? !!p : !!p && p.every(Boolean) };
function totals() {
 const cat = {}; let done = 0; CATS.forEach(c => cat[c] = [0,0,0,0]);
 ACTS.forEach(a => CATS.forEach((c, ci) => { const p = place(a.t, S.res[rk(a, ci)]); if (p) { done++; p.forEach((x, i) => { if (x) cat[c][i] += S.pts[x-1] || 0 }) } }));
 const ig = T.map(i => (S.insta[i] || []).filter(Boolean).length * S.ig), fn = T.map(i => (S.fans || []).filter(f => +f.team === i).length * S.fan);
 return {cat, ig, fn, done, tot: T.map(i => CATS.reduce((a, c) => a + cat[c][i], 0) + ig[i] + fn[i])};
}

/* ==========================================================================
   4. COMPONENTES VISUAIS (VIEWS) — uma por página
   ========================================================================== */
const chips = p => p ? T.map(i => p[i] ? `<span class="chip" style="--c:var(--t${i})" title="${tn(i)}">${p[i]}º</span>` : '').join('') : '—';

const Views = {
 placar() {
  const o = totals(), order = T.slice().sort((a, b) => o.tot[b] - o.tot[a]), mx = Math.max(1, ...o.tot);
  const rows = order.map((i, k) => `<div class="rrow"><div class="rpos">${k+1}º</div><div><div class="rname">${tn(i)}</div><div class="bar" style="--c:var(--t${i});width:${Math.max(1, o.tot[i]/mx*100)}%"></div></div><div class="rpts">${o.tot[i]}</div></div>`).join('');
  const ln = (n, a) => `<tr><td>${n}</td>${a.map(v => `<td>${v}</td>`).join('')}</tr>`;
  return`<section class="panel ${first?'grow':''}"><h2>Classificação geral</h2><div class="race">${rows}</div></section>
  <section class="panel"><h2>Pontos por categoria</h2><div class="scroll"><table><thead><tr><th>Categoria</th>${T.map(i => `<th><span class="dot" style="--c:var(--t${i})"></span>${tn(i)}</th>`).join('')}</tr></thead><tbody>
  ${CATS.map(c => ln(c, o.cat[c])).join('')}${ln('Instagram', o.ig)}${ln('Torcida famosa', o.fn)}</tbody><tfoot><tr><td>Total geral</td>${o.tot.map(v => `<td>${v}</td>`).join('')}</tr></tfoot></table></div></section>`;
 },

 mod() {
  const fl = ['todas', ...Object.keys(TN)].map(k => `<button class="chipbtn" data-flt="${k}" aria-pressed="${flt==k}">${k=='todas'?'Todas':TN[k]}</button>`).join('');
  const rows = ACTS.filter(a => flt=='todas'||a.t==flt).map(a => `<div class="act"><div><a href="#/m/${a.s}/0"><strong>${esc(a.n)}</strong></a><small>${TN[a.t]}</small></div>${CATS.map((c, ci) => { const p = place(a.t, S.res[rk(a, ci)]); return`<a class="cell ${p?'done':''}" href="#/m/${a.s}/${ci}"><span class="l">${c}</span>${chips(p)}</a>` }).join('')}</div>`).join('');
  return`<section class="panel"><h2>Modalidades e atividades</h2><p class="muted">Cada modalidade e cada categoria têm a sua própria página. Toque numa categoria para lançar o resultado.</p><div class="filters">${fl}</div><div class="acts">${rows}</div></section>`;
 },

 insta() {
  const header = `<thead><tr><th style="text-align:left">Dia</th>${T.map(i => `<th style="text-align:center"><span class="dot" style="--c:var(--t${i})"></span>${tn(i)}</th>`).join('')}</tr></thead>`;
  const rows = Array.from({length:20}, (_, d) => {
   const cols = T.map(i => `<td style="text-align:center"><input type="checkbox" data-ig="${i},${d}" ${S.insta[i]?.[d]?'checked':''} aria-label="${tn(i)} dia ${d+1}"></td>`).join('');
   return `<tr><td style="text-align:left;font-weight:600">Dia ${d+1}</td>${cols}</tr>`;
  }).join('');

  return`<section class="panel">
   <h2>Instagram</h2>
   <p class="muted">Cada equipe pode postar 1× por dia durante os 20 dias. Vale ${S.ig} pontos por dia.</p>
   <div class="row" style="font-size:13px;gap:8px;margin-bottom:12px">${T.map(i => `<span><span class="dot" style="--c:var(--t${i})"></span>${tn(i)}: <strong>${(S.insta[i] || []).filter(Boolean).length}</strong></span>`).join('')}</div>
   <div class="scroll"><table>${header}<tbody>${rows}</tbody></table></div>
  </section>`;
 },

 torc() {
  const fans = S.fans || [];
  const list = fans.map((f, k) => `<tr><td>${esc(f.name)}</td><td style="text-align:left"><span class="dot" style="--c:var(--t${f.team})"></span>${tn(f.team)}</td><td><button class="btn warn" data-delfan="${k}">Remover</button></td></tr>`).join('');
  return`<section class="panel"><h2>Torcida famosa</h2><p class="muted">Cada torcedor vale ${S.fan} pontos para a equipe escolhida.</p>

  <div class="row" style="font-size:13px;gap:8px">${T.map(i => `<span><span class="dot" style="--c:var(--t${i})"></span>${tn(i)}: <strong>${fans.filter(f => +f.team===i).length}</strong></span>`).join('')}</div>
  <div class="scroll"><table><thead><tr><th>Torcedor(a)</th><th style="text-align:left">Equipe</th><th></th></tr></thead><tbody>${list||'<tr><td colspan="3" class="muted">Nenhum torcedor cadastrado.</td></tr>'}</tbody></table></div></section>`;
 },

  <section class="panel"><h2>Pontos por posição</h2><div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${T.map(i => `<label style="font-size:12px">${i+1}º lugar <input type="number" min="0" data-cfg="pts.${i}" value="${S.pts[i]}"></label>`).join('')}</div>
  <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><label style="font-size:12px">Pts torcedor <input type="number" min="0" data-cfg="fan" value="${S.fan}"></label><label style="font-size:12px">Pts dia post <input type="number" min="0" data-cfg="ig" value="${S.ig}"></label></div></section>
  <section class="panel"><h2>Dados</h2><p class="muted">Exporte um backup para guardar os resultados confirmados.</p><div class="row"><button class="btn" data-export>Exportar backup</button><button class="btn warn" data-reset>Zerar tudo</button></div></section>`;
 }
};

/* Componentes auxiliares para renderizar cada modalidade */
const TO = () => [['','—'], ...T.map(i => [i, S.teams[i]])];
const I = (k, v, x='') => `<input data-k="${k}" value="${esc(v??'')}" ${x}>`;
const ST = (k, v, dis) => `<span class="st"><button class="sb" data-step="${k}" data-d="-1" ${dis?'disabled':''} aria-label="Diminuir">−</button><input data-k="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="–" value="${v??''}" ${dis?'disabled':''}><button class="sb" data-step="${k}" data-d="1" ${dis?'disabled':''} aria-label="Aumentar">+</button></span>`;
const SEL = (k, v, opts, dis, taken=[]) => `<select data-k="${k}" ${dis?'disabled':''}>${opts.filter(([val]) => val===''||String(val)===String(v??'')||!taken.includes(String(val))).map(([val, l]) => `<option value="${val}" ${String(v??'')===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const who = t => `<span style="width:120px;display:inline-flex;align-items:center"><span class="dot" style="--c:var(--t${t})"></span>${tn(t)}</span>`;

function mrow(x, m, sel, label, d) {
 m = m || {}; const lock = !!m.ok, has = m.a!=='' && m.a!=null && m.b!=='' && m.b!=null;
 const tie = num(m.sa)!=null && num(m.sa)===num(m.sb), dis = lock || !has;
 const slots = ['s1','s2'].flatMap(s => ['a','b'].map(z => [s+z, d.m?.[s]?.[z]]));
 const pick = z => SEL(`m.${x}.${z}`, m[z], TO(), lock, slots.filter(s => s[0]!=x+z).map(s => s[1]).filter(v => v!==''&&v!=null).map(String));
 const nm = z => `<strong>${m[z]===''||m[z]==null?'—':tn(m[z])}</strong>`;
 const duel = (ka, va, kb, vb, dd, ta, tb) => `<div class="duel"><div class="side">${ta||''}${ST(ka, va, dd)}</div><span class="x">×</span><div class="side">${tb||''}${ST(kb, vb, dd)}</div></div>`;
 return`<div class="match"><h3>${label}</h3>${duel(`m.${x}.sa`, m.sa, `m.${x}.sb`, m.sb, dis, sel?pick('a'):nm('a'), sel?pick('b'):nm('b'))}
 <p class="muted" style="margin:10px 0 4px">Desempate (se necessário)</p>${duel(`m.${x}.da`, m.da, `m.${x}.db`, m.db, dis||!tie)}
 <div class="row" style="margin-top:10px">${lock?`<span class="ok">✔ Resultado confirmado</span><button class="btn alt" data-edit="${x}">Editar</button>`:`<button class="btn" data-conf="${x}" ${win({...m, ok:true})?'':'disabled'}>Salvar resultado</button>`}</div></div>`;
}

function secHTML(ci) {
 const a = cur, d = view(rk(a, ci)), lock = !!d.ok; let h = '';
 if (a.t == 'rank') h = T.map(t => `<div class="row" style="justify-content:space-between">${who(t)}<div style="flex:1;max-width:180px">${SEL('p.'+t, d.p?.[t], [['','—'], ...[1,2,3,4].map(n => [n, n+'º lugar'])], lock, T.filter(u => u!=t).map(u => String(d.p?.[u]||'')).filter(Boolean))}</div></div>`).join('');
 if (a.t == 'pontos') h = `<p class="muted">Pontuação da arbitragem. Maior pontuação vence.</p>`+T.map(t => `<div class="row" style="justify-content:space-between">${who(t)}<div style="flex:1;max-width:140px">${I('v.'+t, d.v?.[t], `type="number" min="0" step="any" ${lock?'disabled':''}`)}</div></div>`).join('');
 if (a.t == 'crit') h = `<p class="muted">Notas por critério (até 10). A soma define a classificação.</p><div class="scroll"><table><tbody>`+T.map(t => `<tr><td>${who(t)}</td>${[0,1,2,3,4,5].map(k => `<td>${I(`c.${t}.${k}`, d.c?.[t]?.[k], `type="number" min="0" max="10" step="any" style="width:48px" ${lock?'disabled':''}`)}</td>`).join('')}</tr>`).join('')+`</tbody></table></div>`;

 if (a.t == 'marca') {
  const e = d.e && d.e.length ? d.e : [{}];
  h = `<p class="muted">Digite o nome do atleta, selecione a equipe e digite o tempo correspondente.</p>
  <div class="marca-header"><span>Atleta</span><span>Equipe</span><span>Tempo</span><span></span></div>`+
  e.map((x, k) => `
  <div class="marca-row">
   ${I(`e.${k}.n`, x.n, `placeholder="Nome do atleta" ${lock?'disabled':''}`)}
   ${SEL(`e.${k}.team`, x.team, TO(), lock)}
   ${I(`e.${k}.t`, x.t, `placeholder="00'00'00" class="input-tempo" inputmode="numeric" ${lock?'disabled':''}`)}
   <button class="btn warn btn-del" data-rme="${k}" ${lock?'disabled':''} aria-label="Remover">×</button>
  </div>`).join('')+
  `<div class="row" style="margin-top:10px"><button class="btn alt" data-adde ${lock?'disabled':''}>+ Atleta</button></div>`;
 }

 if (a.t == 'chav') {
  const isLocked = !!(d.m?.s1?.ok || d.m?.s2?.ok);
  const btnSortear = `<div class="row" style="margin-bottom:12px"><button class="btn alt" data-sortear="${ci}" ${isLocked?'disabled':''}>🎲 Sortear Semifinais</button></div>`;
  return btnSortear + mrow('s1', chavM(d).s1, true, 'Semifinal 1', d) + mrow('s2', chavM(d).s2, true, 'Semifinal 2', d) + mrow('t3', chavM(d).t3, false, 'Disputa de 3º lugar', d) + mrow('f', chavM(d).f, false, 'Final', d) + pvHTML(a.t, d, true);
 }
 const foot = lock ? `<div class="row" style="margin-top:10px"><span class="ok">✔ Resultado confirmado</span><button class="btn alt" data-edit="">Editar</button></div>` : `<div class="row" style="margin-top:10px"><button class="btn" data-conf="" ${ready(a.t, d)?'':'disabled'}>Confirmar resultado final</button></div>`;
 return h + pvHTML(a.t, d, lock) + foot;
}

function pvHTML(t, d, final) {
 const p = t=='chav' ? place(t, d) : place(t, {...d, ok:true});
 return`<div class="pv"><strong>Classificação${final?'':' (prévia, ainda não salva)'}</strong>`+(p ? T.filter(i => p[i]).sort((x, y) => p[x] - p[y]).map(i => `<div><span>${p[i]}º · <span class="dot" style="--c:var(--t${i})"></span>${tn(i)}</span><strong>+${S.pts[p[i]-1]||0}</strong></div>`).join('') : '<div class="muted">Sem resultado confirmado.</div>')+`</div>`;
}

/* ==========================================================================
   5. CONTROLADORES E ROTEAMENTO DE PÁGINAS
   ========================================================================== */
function sec(ci) { const el = $('sec'+ci); if (el) el.innerHTML = secHTML(ci); }

function renderNav() {
 const ativa = pg == 'modedit' ? 'cfg' : pg;
 $('tabs').innerHTML = TABS.map(([k, n, h]) => `<a href="${h}" ${ativa==k?'aria-current="page"':''}>${n}</a>`).join('');
}

/* Página de uma modalidade: vinculada à página MODALIDADES */
function page() {
 $('tabs').innerHTML = '';
 const links = CATS.map((c, ci) => `<a href="#/m/${cur.s}/${ci}" ${ci==curC?'aria-current="page"':''}>${c}</a>`).join('');
 const btnReg = cur.r ? `<div class="row" style="margin-top:8px"><button class="btn alt" data-verreg>📄 Ver regulamento</button></div>` : '';
 $('main').innerHTML = `<div class="page-head"><a class="back" href="#/modalidades">← Voltar às modalidades</a><h2 class="ptitle">${esc(cur.n)}</h2><p class="muted">${TN[cur.t]}</p>${btnReg}</div><nav class="catnav" aria-label="Categorias">${links}</nav><section class="panel"><h2>${CATS[curC]}</h2><div id="sec${curC}"></div></section>`;
 sec(curC);
}

/* Título da aba fixo em todas as páginas: usa o que estiver na tag <title> */
const TITULO_PADRAO = document.title;
function setTitle() { document.title = TITULO_PADRAO; }

function render() {
 pendente = false;
 const sync = db ? 'sincronizado em tempo real' : 'modo local (neste aparelho)';
 if (cur) {
  page();
  setTitle(cur.n);
  $('sub').textContent = sync.charAt(0).toUpperCase() + sync.slice(1);
  return;
 }
 renderNav();
 $('main').innerHTML = Views[pg]();
 setTitle(pg == 'placar' ? '' : pg == 'modedit' ? 'Editar modalidades' : TABS.find(x => x[0] == pg)[1]);
 $('sub').textContent = (pg == 'placar' || pg == 'mod')
  ? `${totals().done} de ${ACTS.length*3} resultados confirmados · ${db ? 'sincronizado' : 'modo local'}`
  : sync.charAt(0).toUpperCase() + sync.slice(1);
 if (pg == 'placar') first = false;
}

function loadingView() {
 if (cur) $('tabs').innerHTML = ''; else renderNav();
 $('main').innerHTML = `<section class="panel"><p class="muted">Carregando dados atualizados…</p></section>`;
}

async function route() {
 const tok = ++navTok, h = location.hash;
 const m = h.match(/^#\/m\/([^/]+)(?:\/(\d))?$/);

 /* Modalidade criada em outro aparelho e ainda desconhecida aqui: busca a lista antes */
 if (m && !BY[m[1]] && db) {
  try { await DB.fetchCfg('mods'); } catch (e) { console.error(e); }
  if (tok !== navTok) return;
 }

 cur = m && BY[m[1]] || null;
 curC = m && m[2] && +m[2] < CATS.length ? +m[2] : 0;
 pg = cur ? 'mod' : (ROUTES[h] || 'placar');
 pendente = false;

 /* Páginas com edição só abrem depois de buscar a versão mais recente do servidor */
 const editavel = !!cur || pg == 'insta' || pg == 'torc' || pg == 'cfg' || pg == 'modedit';
 carregando = editavel && !!db;
 if (carregando) loadingView(); else render();
 scrollTo(0, 0);

 DB.setupRealtime();
 try {
  await DB.fetchCfg(COLS[cur ? 'm' : pg]);
  if (cur) await DB.fetchSingleRes(cur, curC);
  else if (pg == 'placar' || pg == 'mod') await DB.fetchAllRes();
  save();
 } catch (e) { console.error(e); }

 if (tok !== navTok) return; // o usuário já navegou para outra página
 if (carregando) { carregando = false; render(); }
 else softRender();
}
addEventListener('hashchange', route);

/* Ações de Edição e Confirmação (páginas de modalidade) */
function edit(ci, k, v, fs) {
 const key = rk(cur, ci); ensureD(key); setPath(D[key], k, v);
 const mm = k.match(/^m\.(\w+)\.s[ab]$/);
 if (mm) { const m = D[key].m[mm[1]]; if (!(num(m.sa)!=null && num(m.sa)===num(m.sb))) { delete m.da; delete m.db; } }
 sec(ci);
 if (fs) { const e = document.querySelector(`#sec${ci} ${fs}`); e && e.focus(); }
}

function confirmAct(ci, x) {
 const key = rk(cur, ci); ensureD(key); const d = D[key];
 if (cur.t == 'chav') {
  d.m = d.m || {}; const v = chavM(d); const m = {...(x=='s1'||x=='s2' ? d.m[x] : v[x]), ok:true}; if (!win(m)) return;
  d.m[x] = m; const sm = (S.res[key] = S.res[key] || {}).m = S.res[key].m || {}; sm[x] = clone(m);
  if (x=='s1'||x=='s2') { delete sm.t3; delete sm.f; delete d.m.t3; delete d.m.f; }
 } else {
  if (!ready(cur.t, d)) return;
  d.ok = true; S.res[key] = clone(d); delete D[key];
 }
 DB.persistRes(cur, ci);
 sec(ci);
}

function reopen(ci, x) {
 const key = rk(cur, ci); ensureD(key);
 if (cur.t == 'chav') { D[key].m = D[key].m || {}; D[key].m[x] = D[key].m[x] || {}; D[key].m[x].ok = false; }
 else D[key].ok = false;
 sec(ci);
}

/* Backup: busca tudo do servidor antes de exportar, já que cada página carrega só o que usa */
async function exportar() {
 try { await DB.fetchCfg('*'); await DB.fetchAllRes(); save(); } catch (e) { console.error(e); }
 const a = document.createElement('a');
 a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'}));
 a.download = 'olimpiadas-backup.json';
 a.click();
}

/* ==========================================================================
   6. EVENT LISTENERS & MÁSCARAS
   ========================================================================== */
document.addEventListener('input', e => {
 if (e.target && e.target.classList.contains('input-tempo')) {
  const el = e.target;
  let digitos = el.value.replace(/\D/g, '');
  if (!digitos) { el.value = ''; return; }
  digitos = digitos.slice(-6).padStart(6, '0');
  el.value = `${digitos.slice(0, 2)}'${digitos.slice(2, 4)}'${digitos.slice(4, 6)}`;
 }
});

document.addEventListener('click', e => {
 const t = e.target.closest('button'); if (!t) return;
 const g = n => t.dataset[n], s = t.closest('[id^=sec]'), ci = s ? +s.id.slice(3) : null;
 if (g('flt')) { flt = g('flt'); render(); }
 else if (g('step')) { const key = rk(cur, ci), c = num(getPath(view(key), g('step'))), n = c==null ? (+g('d')>0?1:0) : Math.max(0, c + +g('d')); edit(ci, g('step'), n, `[data-step="${g('step')}"][data-d="${g('d')}"]`); }
 else if (g('conf')!==undefined) confirmAct(ci, g('conf'));
 else if (g('edit')!==undefined) reopen(ci, g('edit'));
 else if (g('adde')!==undefined) { const key = rk(cur, ci); ensureD(key); D[key].e = (D[key].e && D[key].e.length ? D[key].e : [{}]).concat([{}]); sec(ci); }
 else if (g('rme')!==undefined) { const key = rk(cur, ci); ensureD(key); (D[key].e = D[key].e || [{}]).splice(+g('rme'), 1); sec(ci); }
 else if (g('sortear')!==undefined) {
  const key = rk(cur, ci); ensureD(key);
  const shuffled = [0,1,2,3].sort(() => Math.random() - 0.5);
  D[key].m = D[key].m || {};
  D[key].m.s1 = {...(D[key].m.s1||{}), a: shuffled[0], b: shuffled[1]};
  D[key].m.s2 = {...(D[key].m.s2||{}), a: shuffled[2], b: shuffled[3]};
  delete D[key].m.s1.sa; delete D[key].m.s1.sb; delete D[key].m.s1.da; delete D[key].m.s1.db;
  delete D[key].m.s2.sa; delete D[key].m.s2.sb; delete D[key].m.s2.da; delete D[key].m.s2.db;
  sec(ci);
 }
 else if (g('addfan')!==undefined) {
  const n = $('fn').value.trim(), team = +$('ft').value; if (!n) return;
  t.disabled = true;
  DB.patchCfg(['fans'], () => {
   S.fans = S.fans || [];
   S.fans.push({id: uid(), name: n, team});
  }).then(render);
 }
 else if (g('delfan')!==undefined) {
  const alvo = (S.fans || [])[+g('delfan')]; if (!alvo) return;
  t.disabled = true;
  DB.patchCfg(['fans'], () => {
   S.fans = S.fans || [];
   const k = S.fans.findIndex(f => alvo.id ? f.id === alvo.id : (f.name === alvo.name && +f.team === +alvo.team));
   if (k > -1) S.fans.splice(k, 1);
  }).then(render);
 }
 else if (g('export')!==undefined) exportar();
 else if (g('reset')!==undefined) {
  if (confirm('Apagar os resultados e configurações deste aparelho e do servidor?')) {
   S = fresh(); Object.keys(D).forEach(k => delete D[k]);
   (async () => {
    await DB.saveAllCfg();
    if (db) { const { error } = await db.from('res').delete().neq('id', ''); if (error) fail(error); }
    render();
   })();
  }
 }
});

document.addEventListener('change', e => {
 const el = e.target;
 if (el.dataset.k && cur) {
  const s = el.closest('[id^=sec]'); let v = el.value;
  if (el.type == 'number' && v !== '') v = el.dataset.k.startsWith('v.') || el.dataset.k.startsWith('c.') ? Math.max(0, +v) : Math.max(0, Math.floor(+v));
  edit(+s.id.slice(3), el.dataset.k, v, `[data-k="${el.dataset.k}"]`);
 }
 else if (el.dataset.ig) {
  const [i, d] = el.dataset.ig.split(',').map(Number), marcado = el.checked;
  el.disabled = true;
  DB.patchCfg(['insta'], () => {
   S.insta = S.insta || [];
   S.insta[i] = S.insta[i] || Array(20).fill(false);
   S.insta[i][d] = marcado;
  }).then(render);
 }
 else if (el.dataset.cfg) {
  const k = el.dataset.cfg.split('.'), bruto = el.value;
  DB.patchCfg([k[0]], () => {
   const v = k[0]=='teams' ? (bruto.trim() || S.teams[+k[1]]) : Math.max(0, +bruto||0);
   if (k.length == 2) S[k[0]][+k[1]] = v; else S[k[0]] = v;
  }).then(softRender);
 }
});

/* ==========================================================================
   7. EDITOR DE MODALIDADES E REGULAMENTOS (página vinculada às Configurações)
   ========================================================================== */
const listaMods = () => clone(Array.isArray(S.mods) ? S.mods : MODS_PADRAO);
const mesmoNome = (a, b) => slug(a) === slug(b);

/* Gera um id único e permanente para uma nova modalidade */
function novoId(nome, lista) {
 const base = slug(nome) || 'modalidade', usados = new Set(lista.map(x => x.id));
 let id = base, n = 2;
 while (usados.has(id)) id = `${base}-${n++}`;
 return id;
}

/* Se a modalidade aberta foi excluída ou mudou de tipo em outro aparelho */
function syncCur() {
 if (!cur) return;
 const atual = BY[cur.s];
 if (!atual || atual.t !== cur.t) CATS.forEach((_, ci) => delete D[rk(cur, ci)]);
 if (!atual) { cur = null; if (location.hash.startsWith('#/m/')) location.hash = '#/modalidades'; return; }
 cur = atual;
}

/* Apaga os resultados de uma modalidade nas três categorias */
async function apagarResultados(id) {
 CATS.forEach((_, ci) => { delete S.res[id + '|' + ci]; delete D[id + '|' + ci]; });
 save();
 if (!db) return;
 const { error } = await db.from('res').delete().in('id', CATS.map((_, ci) => `${id}_${ci}`));
 if (error) fail(error);
}

/* Regulamentos: tabela própria (reg), lida só quando alguém abre o regulamento */
const REG = {
 async get(id) {
  if (!db) return (S.regs || {})[id] || '';
  const { data, error } = await db.from('reg').select('txt').eq('id', id);
  if (error) throw error;
  return data && data.length ? (data[0].txt || '') : '';
 },
 async set(id, txt) {
  if (!db) {
   S.regs = S.regs || {};
   if (txt) S.regs[id] = txt; else delete S.regs[id];
   save(); return true;
  }
  const { error } = txt
   ? await db.from('reg').upsert({ id, txt, updated_at: new Date().toISOString() })
   : await db.from('reg').delete().eq('id', id);
  if (error) { fail(error); return false; }
  return true;
 }
};

/* Janela (dialog) usada tanto para consultar quanto para editar o regulamento */
document.body.insertAdjacentHTML('beforeend', '<dialog id="regdlg" class="reg-dlg" aria-label="Regulamento"></dialog>');
let regTok = 0, regOriginal = '';
const regSujo = () => { const t = $('regtxt'); return !!t && t.value.trim() !== regOriginal.trim(); };

function abrirReg(a, editar) {
 const dlg = $('regdlg'), tok = ++regTok;
 regOriginal = '';
 dlg.innerHTML = `<div class="reg-box">
  <div class="reg-head"><h2>Regulamento · ${esc(a.n)}</h2><button class="btn alt" data-regfechar aria-label="Fechar">✕</button></div>
  <div class="reg-body" id="regcorpo"><p class="muted">Carregando…</p></div>
  ${editar ? `<div class="reg-foot"><button class="btn alt" data-regfechar>Cancelar</button><button class="btn" data-regsalvar="${a.s}" disabled>Salvar regulamento</button></div>` : ''}
 </div>`;
 if (!dlg.open) dlg.showModal();
 REG.get(a.s).then(txt => {
  if (tok !== regTok || !dlg.open) return;
  const corpo = $('regcorpo');
  if (editar) {
   regOriginal = txt;
   corpo.innerHTML = `<textarea id="regtxt" placeholder="Cole ou digite aqui o regulamento da modalidade…">${esc(txt)}</textarea>`;
   dlg.querySelector('[data-regsalvar]').disabled = false;
   $('regtxt').focus();
  } else {
   corpo.innerHTML = txt ? esc(txt) : '<p class="muted">Regulamento ainda não cadastrado.</p>';
  }
 }).catch(e => {
  console.error(e);
  if (tok === regTok) $('regcorpo').innerHTML = '<p class="muted">Não foi possível carregar o regulamento. Tente novamente.</p>';
 });
}

function fecharReg() {
 if (regSujo() && !confirm('Descartar as alterações do regulamento?')) return;
 $('regdlg').close();
}

async function salvarReg(id, btn) {
 const txt = ($('regtxt') ? $('regtxt').value : '').trim();
 btn.disabled = true; btn.textContent = 'Salvando…';
 if (!await REG.set(id, txt)) { btn.disabled = false; btn.textContent = 'Salvar regulamento'; return; }
 /* Marca na lista de modalidades se existe regulamento (só um indicador leve, o texto fica na tabela reg) */
 await DB.patchCfg(['mods'], () => {
  S.mods = listaMods();
  const x = S.mods.find(y => y.id === id);
  if (x) { if (txt) x.r = 1; else delete x.r; }
  buildActs();
 });
 regOriginal = txt;
 $('regdlg').close();
 render();
}

$('regdlg').addEventListener('cancel', e => { if (regSujo() && !confirm('Descartar as alterações do regulamento?')) e.preventDefault(); });
$('regdlg').addEventListener('click', e => { if (e.target === $('regdlg') && !$('regtxt')) $('regdlg').close(); });

/* Atalho para o editor dentro da página de Configurações */
const cfgOriginal = Views.cfg;
Views.cfg = () => `<section class="panel"><h2>Modalidades</h2><p class="muted">${ACTS.length} modalidades cadastradas. Inclua, renomeie, exclua, mude o tipo ou cadastre o regulamento de cada uma.</p><div class="row"><a class="btn" href="#/configuracoes/modalidades" style="text-decoration:none;display:inline-flex;align-items:center">Editar modalidades</a></div></section>` + cfgOriginal();

Views.modedit = () => {
 const tipos = Object.keys(TN);
 const opts = v => tipos.map(t => `<option value="${t}" ${t==v?'selected':''}>${TN[t]}</option>`).join('');
 const grupos = tipos.map(t => {
  const itens = ACTS.filter(a => a.t == t);
  if (!itens.length) return '';
  return `<h3 class="me-grupo">${TN[t]} <span>(${itens.length})</span></h3>` + itens.map(a => `
  <div class="me-row">
   <input data-mn="${a.s}" value="${esc(a.n)}" aria-label="Nome da modalidade">
   <select data-mt="${a.s}" aria-label="Tipo de ${esc(a.n)}">${opts(a.t)}</select>
   <button class="btn alt btn-del me-reg ${a.r?'on':''}" data-mreg="${a.s}" title="${a.r?'Editar regulamento':'Cadastrar regulamento'}" aria-label="Regulamento de ${esc(a.n)}">📄</button>
   <button class="btn warn btn-del" data-mdel="${a.s}" aria-label="Excluir ${esc(a.n)}">×</button>
  </div>`).join('');
 }).join('');
 return `<div class="page-head"><a class="back" href="#/configuracoes">← Voltar às configurações</a></div>
 <section class="panel"><h2>Nova modalidade</h2>
  <div class="me-row novo"><input id="mnovo" placeholder="Nome da modalidade"><select id="mtnovo" aria-label="Tipo">${opts('chav')}</select><button class="btn" data-madd>Adicionar</button></div>
 </section>
 <section class="panel"><h2>Modalidades cadastradas (${ACTS.length})</h2>
  <p class="muted">📄 abre o regulamento (destacado quando já existe). Mudar o nome mantém os resultados. Mudar o tipo ou excluir apaga os resultados dessa modalidade nas três categorias.</p>
  ${grupos || '<p class="muted">Nenhuma modalidade cadastrada.</p>'}
 </section>`;
};

/* Cliques do regulamento (funcionam na página da modalidade e no editor) */
document.addEventListener('click', e => {
 const t = e.target.closest('button'); if (!t) return;
 if (t.dataset.verreg !== undefined && cur) abrirReg(cur, false);
 else if (t.dataset.mreg && !cur && pg === 'modedit') { const a = BY[t.dataset.mreg]; if (a) abrirReg(a, true); }
 else if (t.dataset.regfechar !== undefined) fecharReg();
 else if (t.dataset.regsalvar) salvarReg(t.dataset.regsalvar, t);
});

/* Cliques do editor de modalidades */
document.addEventListener('click', e => {
 const t = e.target.closest('button');
 if (!t || cur || pg !== 'modedit') return;

 if (t.dataset.madd !== undefined) {
  const nome = $('mnovo').value.trim(), tipo = $('mtnovo').value;
  if (!nome) { $('mnovo').focus(); return; }
  if (!TN[tipo]) return;
  let repetido = false;
  t.disabled = true;
  DB.patchCfg(['mods'], () => {
   S.mods = listaMods();
   if (S.mods.some(x => mesmoNome(x.n, nome))) { repetido = true; return; }
   S.mods.push({id: novoId(nome, S.mods), n: nome, t: tipo});
   buildActs();
  }).then(() => { if (repetido) alert(`Já existe uma modalidade chamada "${nome}".`); render(); });
 }

 else if (t.dataset.mdel) {
  const id = t.dataset.mdel, a = BY[id]; if (!a) return;
  if (!confirm(`Excluir "${a.n}"?\nOs resultados lançados dessa modalidade nas três categorias e o regulamento também serão apagados.`)) return;
  t.disabled = true;
  DB.patchCfg(['mods'], () => { S.mods = listaMods().filter(x => x.id !== id); buildActs(); })
   .then(() => apagarResultados(id))
   .then(() => REG.set(id, ''))
   .then(render);
 }
});

document.addEventListener('change', e => {
 const el = e.target;
 if (cur || pg !== 'modedit') return;

 if (el.dataset.mn) {
  const id = el.dataset.mn, nome = el.value.trim(), a = BY[id]; if (!a) return;
  if (!nome) { el.value = a.n; return; }
  if (nome === a.n) return;
  if (ACTS.some(x => x.s !== id && mesmoNome(x.n, nome))) { alert(`Já existe uma modalidade chamada "${nome}".`); el.value = a.n; return; }
  DB.patchCfg(['mods'], () => {
   S.mods = listaMods();
   const x = S.mods.find(y => y.id === id); if (x) x.n = nome;
   buildActs();
  }).then(softRender);
 }

 else if (el.dataset.mt) {
  const id = el.dataset.mt, tipo = el.value, a = BY[id];
  if (!a || !TN[tipo] || tipo === a.t) return;
  if (!confirm(`Mudar "${a.n}" de ${TN[a.t]} para ${TN[tipo]}?\nOs resultados já lançados dessa modalidade nas três categorias serão apagados, porque o formato é diferente. O regulamento é mantido.`)) { el.value = a.t; return; }
  el.disabled = true;
  DB.patchCfg(['mods'], () => {
   S.mods = listaMods();
   const x = S.mods.find(y => y.id === id); if (x) x.t = tipo;
   buildActs();
  }).then(() => apagarResultados(id)).then(render);
 }
});

/* Inicialização */
route();
</script>
</body>
</html>
