 const dlg = $('inscdlg');
 dlg.innerHTML = `<div class="reg-box">
  <div class="reg-head"><h2>Inscritos · ${esc(cur.n)} · ${esc(catNome(curC))}</h2><button class="btn alt" data-inscfechar aria-label="Fechar">✕</button></div>
  <div class="reg-body" style="white-space:normal" id="inscbody"><p class="muted">Carregando…</p></div>
  <div class="reg-foot mem-foot" id="inscfoot"></div></div>`;
 if (!dlg.open) dlg.showModal();
 await carregarInscritos();
}
async function carregarInscritos() {
 const D0 = inscD; if (!D0) return;
 const rows = await INSC.daModalidade(D0.a.s, D0.cat) || [];
 const ms = await MEM.porIds(rows.map(r => r.membro));
 if (inscD !== D0) return;
 const by = Object.fromEntries(ms.map(m => [m.id, m]));
 D0.lista = rows.filter(r => by[r.membro]).map(r => ({ins: r, m: by[r.membro]}));
 D0.modo = 'lista';
 desenharInscritos();
}
function desenharInscritos() {
 const l = inscD.lista, pres = 0, porPartida = true;
 const grupos = [...T.map(String), ''].map(t => [t, l.filter(x => String(x.m.team) === t).sort((a, b) => porNome(a.m, b.m))]).filter(([, g]) => g.length);
 $('inscbody').innerHTML = !l.length ? '<p class="muted">Ninguém inscrito nesta modalidade e categoria ainda.</p>' :
  (porPartida ? `<p class="insc-resumo">${l.length} ${l.length == 1 ? 'inscrito' : 'inscritos'} · a presença é conferida ${inscD.a.t == 'chav' ? 'em cada partida' : 'em “Integrantes”, na página da modalidade'}</p>` : `<p class="insc-resumo"><strong>${pres}</strong> de ${l.length} presentes</p>`) +
  grupos.map(([t, g]) => `<div class="mem-grupo"><h3>${esc(teamNome(t))}</h3><span>${porPartida ? g.length : g.filter(x => x.ins.presente).length + '/' + g.length}</span></div>` +
   g.map(x => `<label class="insc-row">${porPartida ? '' : `<input type="checkbox" data-pres="${esc(x.ins.id)}" ${x.ins.presente ? 'checked' : ''} aria-label="Presença de ${esc(x.m.nome)}">`}${fotoHTML(x.m)}<span class="mem-info"><span class="mem-nome">${esc(x.m.nome)}</span><span class="mem-sub">${esc(x.m.turma || '—')}</span></span><button class="btn warn btn-del insc-del" data-inscdel="${esc(x.ins.id)}" aria-label="Remover inscrição de ${esc(x.m.nome)}" title="Remover inscrição">×</button></label>`).join('')).join('');
 $('inscfoot').innerHTML = '<button class="btn alt" data-inscadd>+ Inscrever na hora</button><span class="mem-esp"></span><button class="btn" data-inscfechar>Fechar</button>';
}
async function mostrarCandidatos() {
 inscD.modo = 'add';
 $('inscbody').innerHTML = '<p class="muted">Carregando integrantes da categoria…</p>';
 $('inscfoot').innerHTML = '<button class="btn alt" data-inscvoltar>← Voltar</button>';
 const D0 = inscD, todos = await MEM.daCategoria(D0.cat);
 if (inscD !== D0) return;
 const ja = new Set(D0.lista.map(x => x.m.id));
 D0.cand = todos.filter(m => !ja.has(m.id));
 $('inscbody').innerHTML = `<p class="muted" style="margin-top:0;text-align:left">Integrantes de <strong>${esc(catNome(D0.cat))}</strong> que ainda não estão inscritos. Toque para inscrever (já entra como presente).</p>
  <input id="inscqbusca" type="search" placeholder="Buscar integrante" autocomplete="off" style="margin-bottom:8px">
  <div id="insccand" class="mem-grid insc-cand">${candHTML('')}</div>`;
}
function candHTML(q) {
 q = slug(q || '');
 const l = inscD.cand.filter(m => !q || slug(m.nome + ' ' + m.turma).includes(q)).sort(porNome);
 if (!inscD.cand.length) return '<p class="muted">Todos os integrantes desta categoria já estão inscritos.</p>';
 if (!l.length) return '<p class="muted">Ninguém encontrado.</p>';
 return l.map(m => `<button class="mem-card" data-inscnovo="${esc(m.id)}">${fotoHTML(m)}<span class="mem-info"><span class="mem-nome">${esc(m.nome)}</span><span class="mem-sub">${esc(teamNome(m.team))} · ${esc(m.turma || '—')}</span></span></button>`).join('');
}

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
 const t = e.target.closest('button'); if (!t) return;
 const d = t.dataset;
 if (d.inscsel) { inscSel = d.inscsel; inscSet = null; render(); scrollTo(0, 0); carregarInsc(); }
 else if (d.inscoutro !== undefined) { inscSel = null; inscSet = null; render(); }
 else if (d.meminsc !== undefined) { inscSel = memEd.id; inscSet = null; $('memdlg').close(); location.hash = '#/configuracoes/inscricoes'; }
 else if (d.inscver !== undefined && cur) abrirInscritos();
 else if (d.inscfechar !== undefined) { $('inscdlg').close(); inscD = null; inscPag = null; if (inscAbertos.size && cur) sec(curC); }
 else if (d.inscadd !== undefined && inscD) mostrarCandidatos();
 else if (d.inscvoltar !== undefined && inscD) desenharInscritos();
 else if (d.inscnovo && inscD) {
  const m = inscD.cand.find(x => x.id === d.inscnovo); if (!m) return;
  t.disabled = true;
  if (!await INSC.inscrever([{membro: m.id, mod: inscD.a.s, cat: inscD.cat, presente: true}])) { t.disabled = false; return; }
  await carregarInscritos();
 }
});

document.addEventListener('change', async e => {
 const el = e.target;
 if (el.dataset && el.dataset.inscmod && inscSel && inscSet) {
  const m = membros().find(x => x.id === inscSel), mod = el.dataset.inscmod, on = el.checked;
  if (!m) return;
  el.disabled = true;
  const ok = on ? await INSC.inscrever([{membro: m.id, mod, cat: m.cat, presente: false}]) : await INSC.remover(inscId(m.id, mod));
  el.disabled = false;
  if (!ok) { el.checked = !on; return; }
  if (on) inscSet.add(mod); else inscSet.delete(mod);
  const c = $('insccont'); if (c) c.textContent = inscContTxt();
 }
 else if (el.dataset && el.dataset.pres && inscD) {
  const id = el.dataset.pres, v = el.checked;
  el.disabled = true;
  const ok = await INSC.presenca(id, v);
  el.disabled = false;
  if (!ok) { el.checked = !v; return; }
  const x = inscD.lista.find(y => y.ins.id === id); if (x) x.ins.presente = v;
  desenharInscritos();
 }
 else if (el.id === 'inscfteam' || el.id === 'inscfcat') {
  inscF[el.id === 'inscfteam' ? 'team' : 'cat'] = el.value;
  const l = $('insclista'); if (l) l.innerHTML = inscListaHTML();
 }
});

document.addEventListener('input', e => {
 if (e.target.id === 'inscbusca') { inscF.q = e.target.value; const l = $('insclista'); if (l) l.innerHTML = inscListaHTML(); }
 else if (e.target.id === 'inscqbusca' && inscD) { $('insccand').innerHTML = candHTML(e.target.value); }
});

/* ==========================================================================
   21. INSCRITOS DENTRO DE CADA PARTIDA (chaveamento)
   Recolhido por padrão; ao abrir, mostra só os inscritos das duas equipes da
   partida, com a presença. Busca os inscritos uma vez por página (só ao abrir).
   ========================================================================== */
let inscPag = null, inscAbertos = new Set(), inscBuscando = '';

async function garantirInscPag() {
 if (!cur) return;
 const mod = cur.s, cat = curC, chave = mod + '|' + cat;
 if ((inscPag && inscPag.chave === chave) || inscBuscando === chave) return;
 inscBuscando = chave;
 const rows = await INSC.daModalidade(mod, cat) || [];
 const ms = await MEM.porIds(rows.map(r => r.membro));
 inscBuscando = '';
 if (!cur || cur.s !== mod || curC !== cat) return;
 const by = Object.fromEntries(ms.map(m => [m.id, m]));
 inscPag = {chave, lista: rows.filter(r => by[r.membro]).map(r => ({ins: r, m: by[r.membro]}))};
 sec(curC);
}

/* Bloco recolhível "Integrantes" com presença: x = chave da partida (s1, s2, t3, f) ou 'g' (modalidade sem partidas) */
function inscBlocoHTML(x, times) {
 const aberto = inscAbertos.has(x), ok = !!inscPag && inscPag.chave === cur.s + '|' + curC;
 const tog = `<button class="insc-tog" data-insctog="${x}" aria-expanded="${aberto}">Integrantes<span class="seta" aria-hidden="true">›</span></button>`;
 if (!aberto) return tog;
 if (!ok) { garantirInscPag(); return tog + '<p class="muted" style="margin:6px 0 0">Carregando…</p>'; }
 const pres = l => l.filter(y => presNa(y.ins, x)).length;
 const col = t => {
  const l = inscPag.lista.filter(y => y.m.team === +t).sort((p, q) => porNome(p.m, q.m));
  return `<div class="insc-col"><h4><span>${tn(+t)}</span><span>${pres(l)}/${l.length}</span></h4>${l.length
   ? l.map(y => `<label class="insc-lin"><input type="checkbox" data-ipres="${esc(y.ins.id)}" data-ipart="${x}" ${presNa(y.ins, x) ? 'checked' : ''} aria-label="Presença de ${esc(y.m.nome)}"><span>${esc(y.m.nome)}</span></label>`).join('')
   : '<p class="insc-vazio">Ninguém inscrito</p>'}</div>`;
 };
 return tog + `<div class="insc-part ${times.length > 2 ? 'insc-4' : ''}">${times.map(col).join('')}</div>`;
}
function inscPartidaHTML(x, m) {
 if (m.a === '' || m.a == null || m.b === '' || m.b == null) return '';
 return inscBlocoHTML(x, [m.a, m.b]);
}

document.addEventListener('click', e => {
 const t = e.target.closest('[data-insctog]'); if (!t || !cur) return;
 const x = t.dataset.insctog;
 if (inscAbertos.has(x)) inscAbertos.delete(x); else inscAbertos.add(x);
 sec(curC);
});

document.addEventListener('change', async e => {
 const el = e.target; if (!el.dataset || !el.dataset.ipres || !inscPag) return;
 const id = el.dataset.ipres, x = el.dataset.ipart, v = el.checked;
 const y = inscPag.lista.find(z => z.ins.id === id); if (!y) return;
 el.disabled = true;
 const nova = await INSC.presencaPartida(y.ins, x, v);
 if (!nova) { el.checked = !v; el.disabled = false; return; }
 y.ins.partidas = nova;
 sec(curC);
});

/* Excluir uma inscrição pela janela de inscritos */
document.addEventListener('click', async e => {
 const t = e.target.closest('[data-inscdel]'); if (!t || !inscD) return;
 e.preventDefault();
 const x = inscD.lista.find(y => y.ins.id === t.dataset.inscdel); if (!x) return;
 if (!await confirmar(`Remover ${x.m.nome} dos inscritos de ${inscD.a.n} (${catNome(inscD.cat)})?`)) return;
 if (!await INSC.remover(x.ins.id)) return;
 inscPag = null;
 await carregarInscritos();
});

/* ==========================================================================
   22. SORTEIO ÚNICO DAS SEMIFINAIS + PRESENÇA POR PARTIDA
   ========================================================================== */
/* Embaralhamento com o gerador aleatório criptográfico do navegador */
function embaralhar(l) {
 const a = l.slice();
 for (let i = a.length - 1; i > 0; i--) {
  const r = new Uint32Array(1); (window.crypto || {getRandomValues: x => { x[0] = Math.random() * 4294967296; return x; }}).getRandomValues(r);
  const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]];
 }
 return a;
}

/* Sorteia uma única vez: grava na hora no servidor e trava as equipes das semifinais */
async function sortearSemis(ci) {
 const key = rk(cur, ci);
 if (!await confirmar('Sortear as semifinais?\nO sorteio só pode ser feito uma vez. Depois dele, as equipes das semifinais ficam fixas.')) return;
 await DB.fetchSingleRes(cur, ci);   // confere se outro aparelho já sorteou
 if ((S.res[key] || {}).sorteio) { delete D[key]; sec(ci); avisar('As semifinais desta categoria já foram sorteadas.'); return; }
 const e = embaralhar(T);
 const d = clone(S.res[key] || {});
 d.m = {s1: {a: e[0], b: e[1]}, s2: {a: e[2], b: e[3]}};
 d.sorteio = {em: new Date().toISOString()};
 S.res[key] = d; delete D[key];
 await DB.persistRes(cur, ci);
 sec(ci);
}
const quandoSorteio = s => { try { return new Date(s.em).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}); } catch (e) { return ''; } };

/* Presença por partida: a inscrição guarda a lista de partidas em que o integrante esteve presente */
const presNa = (ins, x) => Array.isArray(ins.partidas) && ins.partidas.includes(x);
INSC.presencaPartida = async (ins, x, v) => {
 let atual = Array.isArray(ins.partidas) ? ins.partidas.slice() : [];
 if (db) {
  const { data, error } = await db.from('inscricoes').select('partidas').eq('id', ins.id);
  if (error) { fail(error); return null; }
  if (data && data.length && Array.isArray(data[0].partidas)) atual = data[0].partidas;
 }
 const nova = v ? [...new Set([...atual, x])] : atual.filter(p => p !== x);
 if (db) {
  const { error } = await db.from('inscricoes').update({partidas: nova, updated_at: new Date().toISOString()}).eq('id', ins.id);
  if (error) { fail(error); return null; }
 } else { const y = (S.insc || []).find(z => z.id === ins.id); if (y) y.partidas = nova; save(); }
 return nova;
};

/* ==========================================================================
   23. NOME DOS JOGOS (topo de todas as páginas, editável nas Configurações)
   ========================================================================== */
const NOME_PADRAO = 'Olimpíadas IN-NOVA 2026';
const nomeJogos = () => String(S.nome || '').trim() || NOME_PADRAO;
function aplicarNome() { const a = $('nomejogos'); if (a) a.textContent = nomeJogos(); }

const cfgAntesNome = Views.cfg;
Views.cfg = () => `<section class="panel"><h2>Nome dos jogos</h2><p class="muted">Aparece no topo de todas as páginas.</p><div class="row"><input id="cfgnome" value="${esc(nomeJogos())}" placeholder="${esc(NOME_PADRAO)}" maxlength="80" autocomplete="off" aria-label="Nome dos jogos"></div></section>` + cfgAntesNome();

document.addEventListener('input', e => { if (e.target.id === 'cfgnome') { const n = e.target.value.trim() || NOME_PADRAO, a = $('nomejogos'); if (a) a.textContent = n; } });
document.addEventListener('change', async e => {
 if (e.target.id !== 'cfgnome') return;
 const v = e.target.value.trim().replace(/\s+/g, ' ').slice(0, 80);
 await DB.patchCfg(['nome'], () => { S.nome = v || NOME_PADRAO; });
 aplicarNome(); softRender();
});
aplicarNome();

/* Inicialização */
route();
</script>
