/* ==========================================================================
   31. CRONOGRAMA
   - Tabela própria "agenda": uma linha por modalidade + categoria (dia, início,
     duração, local e árbitro). Cada linha é gravada sozinha, sem tocar no resto.
   - Página de visualização no menu (#/cronograma) e página de montagem nas
     Configurações (#/configuracoes/cronograma), com checagem de conflitos de
     local, árbitro e categoria e sugestão de horário livre.
   - Horários que já existiam na edição das modalidades continuam valendo até
     serem ajustados no cronograma.
   ========================================================================== */
const DUR_PADRAO = 60, DURS = [15, 20, 30, 40, 45, 50, 60, 75, 90, 120, 150, 180];
const DIA_INI = 7 * 60, DIA_FIM = 22 * 60;   // faixa usada para sugerir horários
const agId = (mod, cat) => `${mod}_${cat}`;
const toMin = h => { const m = String(h || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
const fmtMin = n => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
const fmtDia = (dt, longo) => { const d = new Date(dt + 'T12:00:00'); if (isNaN(d)) return dt; const sem = d.toLocaleDateString('pt-BR', {weekday: longo ? 'long' : 'short'}).replace('.', ''); return `${sem} ${d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'})}`; };

const AG = {
 async listar() {
  if (!db) return;
  const { data, error } = await db.from('agenda').select('*');
  if (error) { console.error(error); return; }
  S.agenda = data || []; save();
 },
 async daMod(mod) {
  if (!db) return;
  const { data, error } = await db.from('agenda').select('*').eq('mod', mod);
  if (error) { console.error(error); return; }
  S.agenda = (S.agenda || []).filter(r => r.mod !== mod).concat(data || []); save();
 },
 async salvar(r) {
  const row = {id: agId(r.mod, r.cat), mod: r.mod, cat: +r.cat, dt: r.dt || null, hr: r.hr || null, dur: r.dur || null, loc: r.loc || null, arb: r.arb || null, updated_at: new Date().toISOString()};
  if (db) { const { error } = await db.from('agenda').upsert(row); if (error) { fail(error); return false; } }
  S.agenda = (S.agenda || []).filter(x => x.id !== row.id).concat([row]); save();
  return true;
 }
};
const agRow = (mod, cat) => (S.agenda || []).find(r => r.id === agId(mod, cat));
const agRows = mod => (S.agenda || []).filter(r => r.mod === mod);

/* Agendamento efetivo de uma modalidade numa categoria: o do cronograma, ou o antigo da edição de modalidades */
const agDeLegado = agDe;
function efetivo(a, cat) {
 const r = agRow(a.s, cat);
 if (r) return {dt: r.dt || '', hr: r.hr || '', dur: +r.dur || DUR_PADRAO, loc: r.loc || '', arb: r.arb || '', novo: true};
 const g = agDeLegado(a, cat), propria = !!((a.agc || {})[cat] && (a.agc || {})[cat].hr);
 return {dt: g.dt, hr: g.hr, dur: DUR_PADRAO, loc: g.loc, arb: g.arb, novo: false, pre: !propria};   // pre: só sugestão, não está agendado
}
/* As páginas de modalidades passam a mostrar o que está no cronograma */
agDe = function (a, ci) {
 if (a.t == 'extra') return agDeLegado(a, ci);
 const vazio = {loc: '', dt: '', hr: '', arb: ''};
 if (a.semCrono) return vazio;
 const ag = c => { const e = efetivo(a, c); return e.dt && e.hr && !e.pre ? e : null; };
 if (ci != null) { const e = ag(ci); return e ? {loc: e.loc, dt: e.dt, hr: `${e.hr}–${fmtMin(toMin(e.hr) + e.dur)}`, arb: e.arb} : vazio; }
 const v = catsDe(a).map(c => ag(c.id)).filter(Boolean);
 if (!v.length) return vazio;
 const comum = f => v.every(x => x[f] === v[0][f]) ? v[0][f] : '';
 return {loc: comum('loc'), dt: comum('dt'), hr: v.length == catsDe(a).length ? comum('hr') : '', arb: ''};
};

/* Todas as atividades agendadas (ou pendentes) */
function itensAgenda() {
 const l = [];
 ACTS.filter(a => a.t != 'extra' && !a.semCrono).forEach(a => catsDe(a).forEach(c => {
  const e = efetivo(a, c.id);
  l.push({mod: a.s, n: a.n, cat: c.id, ...e, ok: !!(e.dt && e.hr && !e.pre)});
 }));
 return l;
}
const sobrepoe = (a, b) => { const i1 = toMin(a.hr), f1 = i1 + (a.dur || DUR_PADRAO), i2 = toMin(b.hr), f2 = i2 + (b.dur || DUR_PADRAO); return i1 < f2 && i2 < f1; };
/* Conflitos de um horário candidato com tudo o que já está agendado */
function conflitos(c) {
 if (!c.dt || !c.hr) return {loc: [], arb: [], cat: []};
 const outros = itensAgenda().filter(x => x.ok && !(x.mod === c.mod && +x.cat === +c.cat) && x.dt === c.dt && sobrepoe(x, c));
 return {
  loc: c.loc ? outros.filter(x => x.loc === c.loc) : [],
  arb: c.arb ? outros.filter(x => x.arb === c.arb) : [],
  cat: outros.filter(x => +x.cat === +c.cat)

}
const faixa = x => `${x.hr}–${fmtMin(toMin(x.hr) + (x.dur || DUR_PADRAO))}`;
const quem = x => `${x.n} (${catNome(x.cat)}, ${faixa(x)})`;

 };

  </div>`;

}

/* ---------- Janela de agendamento com checagem de disponibilidade ---------- */
document.body.insertAdjacentHTML('beforeend', '<dialog id="crdlg" class="reg-dlg" aria-label="Agendar atividade"></dialog>');

/* Procura, no mesmo dia, o primeiro início em que local, árbitro e categoria estão livres */
function crSugerir() {
 const c = crLer();
 if (!c.mod || c.cat === '' || !c.dt) { avisar('Escolha a modalidade, a categoria e o dia para receber uma sugestão.'); return; }
 /* procura a partir do horário escolhido (arredondado de 5 em 5 min) e, se não achar, volta ao começo do dia */
 const base = Math.ceil(Math.max(DIA_INI, c.hr ? toMin(c.hr) : DIA_INI) / 5) * 5, tentativas = [];
 for (let t = base; t + c.dur <= DIA_FIM; t += 5) tentativas.push(t);
 for (let t = DIA_INI; t < base && t + c.dur <= DIA_FIM; t += 5) tentativas.push(t);
 for (const t of tentativas) {
  const k = conflitos({...c, hr: fmtMin(t)});
  if (!k.loc.length && !k.arb.length && !k.cat.length) { $('crhr').value = fmtMin(t); crAtualiza(); return; }
 }
 avisar('Não há horário livre neste dia para esse local, árbitro e categoria. Tente outro dia, local ou árbitro.');
}
async function crSalvar(btn, limpar) {
 const c = crLer();
 if (!c.mod || c.cat === '') { avisar('Escolha a modalidade e a categoria.'); return; }
 if (!limpar && (!c.dt || !c.hr)) { avisar('Informe o dia e o horário de início.'); return; }
 btn.disabled = true;
 await AG.listar();   // confere com a versão mais recente antes de gravar
 const k = limpar ? {loc: [], arb: []} : conflitos(c);
 if (k.loc.length || k.arb.length) {
  const txt = [k.loc.length && `Local ocupado: ${k.loc.map(quem).join('; ')}`, k.arb.length && `Árbitro ocupado: ${k.arb.map(quem).join('; ')}`].filter(Boolean).join('\n');
  avisar(`Não foi possível salvar: há conflito neste horário.\n${txt}\nEscolha outro horário, local ou árbitro, ou toque em “Sugerir horário livre”.`);
  btn.disabled = false; crAtualiza(); return;
 }
 const linha = limpar ? {mod: c.mod, cat: c.cat} : c;
 if (!await AG.salvar(linha)) { btn.disabled = false; return; }
 /* se mudou de modalidade ou categoria no meio da edição, o lugar antigo fica livre */
 const o = crEd && crEd.orig;
 if (!limpar && o && o.tinha && (o.mod !== c.mod || +o.cat !== +c.cat)) await AG.salvar({mod: o.mod, cat: o.cat});
 if (!limpar) { try { localStorage.setItem('olimp-dur', c.dur); } catch (e) {} crDia = c.dt; }
 $('crdlg').close();
 render();
}

/* ==========================================================================
   32. PERÍODO DOS JOGOS (datas e turnos de cada dia)
   Define os dias e horários em que pode haver atividade. O cronograma só oferece
   esses dias e horários, respeitando a pausa do almoço entre manhã e tarde.
   ========================================================================== */
const TURNOS = [['integral', 'Dia todo'], ['manha', 'Só manhã'], ['tarde', 'Só tarde'], ['folga', 'Sem jogos']];
const PER_PADRAO = {manha: {ini: '07:30', fim: '12:00'}, tarde: {ini: '13:30', fim: '17:30'}};
const PASSO = 10;   // intervalo entre os horários oferecidos
const per = () => (S.periodo && S.periodo.ini && S.periodo.fim) ? S.periodo : null;
const fimDeSemana = dt => { const d = new Date(dt + 'T12:00:00').getDay(); return d === 0 || d === 6; };
function datasEntre(ini, fim) { const l = []; let d = new Date(ini + 'T12:00:00'); const f = new Date(fim + 'T12:00:00'); while (d <= f && l.length < 120) { l.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); } return l; }
const turnoDe = (p, dt) => (p.dias || {})[dt] || 'integral';
const turnoNome = t => ({integral: 'dia todo', manha: 'manhã', tarde: 'tarde', folga: 'sem jogos'})[t] || t;
/* dias com jogos dentro do período */
function diasPeriodo() {
 const p = per(); if (!p) return [];
 return datasEntre(p.ini, p.fim).filter(dt => (p.fds || !fimDeSemana(dt)) && turnoDe(p, dt) !== 'folga').map(dt => ({dt, turno: turnoDe(p, dt)}));
}
/* faixas (em minutos) em que pode haver atividade no dia */
function janelas(dt) {
 const p = per(); if (!p) return [[DIA_INI, DIA_FIM]];
 if (!diasPeriodo().some(x => x.dt === dt)) return [];
 const m = [toMin(p.manha.ini), toMin(p.manha.fim)], t = [toMin(p.tarde.ini), toMin(p.tarde.fim)], tu = turnoDe(p, dt);
 return tu === 'manha' ? [m] : tu === 'tarde' ? [t] : [m, t];
}
const cabe = (dt, hr, dur) => janelas(dt).some(([a, b]) => toMin(hr) >= a && toMin(hr) + (dur || DUR_PADRAO) <= b);
const janelasTxt = dt => janelas(dt).map(([a, b]) => `${fmtMin(a)}–${fmtMin(b)}`).join(' e ');

/* ---------- Janela de configuração ---------- */

 if (!ini || !fim || fim < ini) return '<p class="muted">Informe o início e o término para ver os dias.</p>';
 const l = datasEntre(ini, fim).filter(dt => fds || !fimDeSemana(dt));
 if (!l.length) return '<p class="muted">Nenhum dia no período.</p>';
 return l.map(dt => `<div class="per-dia"><span>${fmtDia(dt)}</span><select data-perdia="${dt}" aria-label="Turno de ${fmtDia(dt)}">${TURNOS.map(([v, n]) => `<option value="${v}" ${(perTmp.dias[dt] || 'integral') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>`).join('');
}
function abrirPeriodo() {
 const p = S.periodo || {};
 perTmp = {dias: {...(p.dias || {})}};

   <span class="nv-tit">Manhã</span>
   <div class="ag-grid"><label>Começa<input id="permi" type="time" step="300" value="${esc(m.ini)}"></label><label>Termina<input id="permf" type="time" step="300" value="${esc(m.fim)}"></label></div>
   <span class="nv-tit">Tarde</span>

   <p class="muted per-almoco" id="peralmoco"></p>
   <label class="ag-por"><input type="checkbox" id="perfds" ${p.fds ? 'checked' : ''}> Incluir sábados e domingos</label>

  </div></div>
  <div class="reg-foot mem-foot">${per() ? '<button class="btn warn" data-perlimpar>Remover período</button>' : ''}<span class="mem-esp"></span><button class="btn alt" data-perfechar>Cancelar</button><button class="btn" data-persalvar>Salvar</button></div>
 </div>`;
 if (!$('perdlg').open) $('perdlg').showModal();

 if (datasEntre(ini, fim).length > 90) { avisar('O período pode ter no máximo 90 dias.'); return; }

 if (v.some(x => x == null)) { avisar('Preencha os horários da manhã e da tarde.'); return; }
 if (!(v[0] < v[1] && v[1] <= v[2] && v[2] < v[3])) { avisar('Confira os horários: a manhã termina antes de a tarde começar, e cada turno termina depois de começar.'); return; }

 btn.disabled = true;

/* ---------- Cronograma: só dias e horários disponíveis ---------- */
/* Dia vira lista com os dias do período; Início vira lista com os horários que cabem nos turnos */
function crDiasOpcoes(atual) {
 const l = diasPeriodo().map(x => [x.dt, `${fmtDia(x.dt)} · ${turnoNome(x.turno)}`]);
 if (atual && !l.some(x => x[0] === atual)) l.unshift([atual, `${fmtDia(atual)} · fora do período`]);
 return [['', '— escolha o dia —'], ...l].map(([v, n]) => `<option value="${v}" ${v === atual ? 'selected' : ''}>${esc(n)}</option>`).join('');
}
function crHorasOpcoes(c) {
 const ops = [['', c.dt ? '— escolha o horário —' : 'Escolha o dia primeiro']];
 if (c.dt) janelas(c.dt).forEach(([a, b]) => {
  for (let t = Math.ceil(a / PASSO) * PASSO; t + c.dur <= b; t += PASSO) {
   const k = c.mod && c.cat !== '' ? conflitos({...c, hr: fmtMin(t)}) : {loc: [], arb: [], cat: []};
   const obs = [k.loc.length && 'local ocupado', k.arb.length && 'árbitro ocupado', k.cat.length && 'categoria com outra atividade'].filter(Boolean).join(', ');
   ops.push([fmtMin(t), `${fmtMin(t)}–${fmtMin(t + c.dur)}${obs ? ' · ' + obs : ''}`]);
  }
 });
 if (c.hr && !ops.some(o => o[0] === c.hr)) ops.push([c.hr, `${c.hr} · fora do horário dos jogos`]);
 return ops.map(([v, n]) => `<option value="${v}" ${v === c.hr ? 'selected' : ''}>${esc(n)}</option>`).join('');
}
function crTrocarCampos() {
 if (!per()) return;
 const dt = $('crdt'), hr = $('crhr');
 if (dt && dt.tagName === 'INPUT') { const v = dt.value; dt.outerHTML = `<select id="crdt">${crDiasOpcoes(v)}</select>`; }
 if (hr && hr.tagName === 'INPUT') { const v = hr.value; hr.outerHTML = `<select id="crhr"><option value="${esc(v)}" selected>${esc(v)}</option></select>`; }
 crHoras();
}
function crHoras() {
 const sel = $('crhr'); if (!sel || sel.tagName !== 'SELECT') return;
 const c = crLer(); sel.innerHTML = crHorasOpcoes(c); sel.value = c.hr;
}

abrirCrono = function (mod, cat) {
 abrirCronoAntesPer(mod, cat);
 crTrocarCampos(); crStatus();
 if (per()) { const ds = diasPeriodo(); if (!ds.length) avisar('Não há dias com jogos no período configurado. Ajuste o período nas Configurações.'); }
};
const crPreencherAntesPer = crPreencher;
crPreencher = function (a, cat) {
 const e = crPadrao(a, cat);
 if (per() && $('crdt').tagName === 'SELECT') { $('crdt').innerHTML = crDiasOpcoes(e.dt || $('crdt').value); }
 crPreencherAntesPer(a, cat);
 if (per() && $('crhr').tagName === 'SELECT') { const sel = $('crhr'); sel.innerHTML = crHorasOpcoes({...crLer(), hr: e.hr || ''}); sel.value = e.hr || ''; }
 crStatus();
};
const crAtualizaAntesPer = crAtualiza;
crAtualiza = function () { crHoras(); crAtualizaAntesPer(); };
/* Disponibilidade também mostra se o horário está dentro do período e dos turnos */
const crStatusAntesPer = crStatus;
crStatus = function () {
 crStatusAntesPer();
 const c = crLer(), box = $('crstatus'); if (!box || !per() || !c.dt) return;
 const ul = box.querySelector('.cr-status'); if (!ul) return;
 const dentro = c.hr && cabe(c.dt, c.hr, c.dur);
 ul.insertAdjacentHTML('afterbegin', dentro
  ? `<li class="bom"><strong>Dentro do horário dos jogos</strong> (${esc(janelasTxt(c.dt))})</li>`
  : `<li class="ruim"><strong>Fora do horário dos jogos</strong>. Neste dia: ${esc(janelasTxt(c.dt) || 'sem jogos')}</li>`);
};
/* Sugestão: primeiro horário livre dentro dos turnos, no dia escolhido e, se preciso, nos dias seguintes */
const crSugerirAntesPer = crSugerir;
crSugerir = function () {
 if (!per()) return crSugerirAntesPer();
 const c = crLer();
 if (!c.mod || c.cat === '') { avisar('Escolha a modalidade e a categoria para receber uma sugestão.'); return; }
 const dias = diasPeriodo().map(x => x.dt), i0 = Math.max(0, dias.indexOf(c.dt));
 for (const dt of dias.slice(i0)) {
  for (const [a, b] of janelas(dt)) {
   const ini = dt === c.dt && c.hr ? Math.max(a, toMin(c.hr)) : a;
   for (let t = Math.ceil(ini / PASSO) * PASSO; t + c.dur <= b; t += PASSO) {
    const k = conflitos({...c, dt, hr: fmtMin(t)});
    if (!k.loc.length && !k.arb.length && !k.cat.length) {
     $('crdt').value = dt; crHoras(); $('crhr').value = fmtMin(t); crAtualiza();
     if (dt !== c.dt) avisar(`Sem horário livre no dia escolhido. Sugestão: ${fmtDia(dt)} às ${fmtMin(t)}.`);
     return;
    }
   }
  }
 }
 avisar('Não há horário livre no período para esse local, árbitro e categoria. Tente outro local ou árbitro, ou mude a duração.');
};
/* Salvar: não aceita horário fora do período ou atravessando o almoço */

 if (!limpar && per() && c.dt && c.hr && !cabe(c.dt, c.hr, c.dur)) {
  avisar(`Esse horário está fora do horário dos jogos.\nEm ${fmtDia(c.dt)}: ${janelasTxt(c.dt) || 'sem jogos'}.\nEscolha um horário da lista ou toque em “Sugerir horário livre”.`);
  return;
 }

};

/* Atividades já agendadas fora do período entram no quadro de conflitos */
const crConflitosAntesPer = crConflitosHTML;

 if (!per()) return base;
 const fora = itensAgenda().filter(x => x.ok && !cabe(x.dt, x.hr, x.dur));
 if (!fora.length) return base;
 const bloco = `<div class="cr-crow"><span class="cr-ctit"><strong>Fora do período ou dos turnos</strong> (${fora.length})</span><span class="cr-pcats">${fora.map(x => `<button class="cr-pchip" data-cragendar="${x.mod},${x.cat}">${esc(x.n)} · ${esc(catNome(x.cat))} · ${fmtDia(x.dt)} ${faixa(x)}</button>`).join('')}</span></div>`;
 if (base) return base.replace('</section>', bloco + '</section>');
 return `<section class="panel cr-conf"><h2>Ajustes necessários <span class="cr-n">${fora.length}</span></h2><p class="muted">Atividades fora das datas ou dos turnos definidos no período dos jogos. Toque para reagendar.</p>${bloco}</section>`;
};
