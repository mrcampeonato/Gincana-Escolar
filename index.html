<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)">
<title>Olimpíadas Escolares - Mr Léo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f1c36;--mute:#5a6782;--line:#d9e0eb;--soft:#e8eef6;--t0:#8ecbf5;--t1:#f5a3a3;--t2:#ffe27a;--t3:#a9bdf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#121a2d;--ink:#eaf0fc;--mute:#93a1bf;--line:#263252;--soft:#1a2440}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#121a2d;--ink:#eaf0fc;--mute:#93a1bf;--line:#263252;--soft:#1a2440}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden;width:100%}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:20px 12px 48px;overflow-x:hidden}
header{text-align:center}
header h1{font-size:clamp(24px,6vw,46px);font-weight:800;letter-spacing:-.02em}
header h1 a{color:inherit;text-decoration:none}
header p{margin:6px 0 0;color:var(--mute);font-size:14px}
#tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0}
#tabs:empty{margin:10px 0}
#tabs a,.chipbtn{font:600 14px Figtree,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
#tabs a[aria-current=page],.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.csel:focus-visible{outline:3px solid #3d9ad8;outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;overflow:hidden}
.panel h2{font-size:20px;margin-bottom:12px;text-align:center}
.panel>p{text-align:center}
.race{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}
.rpos{font:800 24px 'Bricolage Grotesque',sans-serif;color:var(--mute);text-align:center}
.rname{font-weight:600;margin-bottom:4px;font-size:15px}
.bar{height:20px;border-radius:6px;background:var(--c);transform-origin:left;min-width:4px}
.grow .bar{animation:g .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes g{from{transform:scaleX(0)}}
.rpts{font:800 22px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:100%}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute)}
tfoot td{font-weight:800;border-bottom:0}
.pts-cat th:not(:first-child),.pts-cat td:not(:first-child){text-align:center}
/* Nome da equipe sobre a cor da equipe, sempre com fonte preta */
.tm{display:inline-block;background:var(--c);color:#000;border-radius:6px;padding:1px 8px;font-weight:600;line-height:1.35;max-width:100%;overflow-wrap:anywhere}
.cfg-eq{width:100%;margin-bottom:12px}
.cfg-eq input{font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border:3px solid var(--ink);transform:scale(1.1)}
.acts{display:grid;gap:8px}
.act{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n,3),124px);gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.act small{display:block;color:var(--mute)}
.act>div:first-child a{color:inherit;text-decoration:none}
.cell{border:1px dashed var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:6px 4px;min-width:70px;text-align:center;font:600 12px Figtree,sans-serif;text-decoration:none;display:block}
.cell:hover{border-color:var(--ink)}
.cell.done{border-style:solid}
.cell{display:flex;flex-direction:column;justify-content:center;min-height:50px;box-sizing:border-box}
.chips{display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:nowrap;min-height:20px;line-height:20px}
.cell span.l{display:block;color:var(--mute);margin-bottom:2px;font-size:10px}
.chip{display:inline-block;min-width:22px;padding:0 4px;margin:0;line-height:20px;border-radius:4px;background:var(--c);color:#000;font-weight:800;font-size:11px}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
input,select,.csel{font:inherit;font-size:14px;min-height:40px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;max-width:100%}
input[type=number]{width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0}
.row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px;width:100%}

.marca-header{
 display:grid;
 grid-template-columns:minmax(0, 1fr) minmax(0, 1.3fr) 76px 30px;
 gap:6px;
 font-weight:600;
 font-size:13px;
 color:var(--mute);
 margin-bottom:6px;
 padding:0 2px;
 align-items:center;
}
.marca-header span{text-align:center;width:100%;display:block}
.marca-row{
 display:grid;
 grid-template-columns:minmax(0, 1fr) minmax(0, 1.3fr) 76px 30px;
 gap:6px;
 align-items:center;
 margin-bottom:8px;
 width:100%;
}
.marca-row input, .marca-row select, .marca-row .csel{
 font-size:13px;
 padding:6px 4px;
 min-height:38px;
 width:100%;
 min-width:0;
 box-sizing:border-box;
}
.marca-row input.input-tempo,.marca-row input.input-dist{text-align:center;font-weight:600;padding:6px 2px}
.btn-del{
 width:30px;
 height:38px;
 min-height:38px;
 padding:0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 font-weight:700;
 border-radius:8px;
}

.btn{font:600 14px Figtree,sans-serif;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn.alt{background:none;color:var(--ink)}
.btn.warn{background:none;color:#c8283a;border-color:#c8283a}
.match{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.match h3{font-size:15px;margin-bottom:10px;text-align:center}
.muted{color:var(--mute);text-align:center;font-size:13px}
.pv{margin-top:12px;padding:10px;background:var(--soft);border-radius:10px}
.pv div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.pv .pv3{display:grid;grid-template-columns:minmax(0,1fr) auto 56px;gap:12px;align-items:center}
.pv .pv3 strong{text-align:right}
.pv-val{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.back{display:inline-block;margin-bottom:10px;color:var(--ink);font-weight:600;font-size:14px}
.ptitle{font-size:clamp(20px,5vw,32px);font-weight:800}
.page-head{text-align:center}
.st{display:inline-flex;align-items:center;gap:4px}
.st input{width:46px;text-align:center;padding:6px 2px}
.sb{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:700 18px/1 Figtree,sans-serif;cursor:pointer}
button:disabled,input:disabled,select:disabled,.csel:disabled{opacity:.45;cursor:not-allowed}
.ok{color:#1f9d55;font-weight:600;font-size:14px}
.catnav{margin:10px 0 14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.catnav a{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:600;text-decoration:none;min-height:38px;display:inline-flex;align-items:center;font-size:13px}
.catnav a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;justify-items:center;text-align:center}
.side{display:grid;gap:6px;justify-items:center;width:100%}
.side select,.side strong,
.side .csel{max-width:100%;width:100%;text-align:center;font-size:13px}
.x{font-weight:800;padding-top:8px}

@media (prefers-reduced-motion:reduce){.grow .bar{animation:none}}
@media (max-width:620px){
 .wrap{padding:10px 8px 32px}
 .panel{padding:12px;border-radius:12px}
 .rpts{font-size:18px}
 .rrow{grid-template-columns:24px 1fr auto}
 .act{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
 .chip{min-width:18px;padding:0 2px;font-size:10px}
 .act>div:first-child{grid-column:1/-1;text-align:center}
 .cell{padding:6px 2px;min-width:0}
 table{min-width:100%}
 th,td{padding:6px 4px;font-size:13px}
 .marca-header, .marca-row {
  grid-template-columns:minmax(0, 1fr) minmax(0, 1.2fr) 68px 28px;
  gap:4px;
 }
 .marca-header {font-size:11px}
 .marca-row input, .marca-row select , .marca-row .csel {font-size:12px;padding:5px 2px}
 .btn-del {width:28px}
}
@media (max-width:380px){.st{gap:2px}.sb{width:34px;height:34px}.st input{width:38px}}
/* Editor de modalidades */
.me-row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto auto auto auto auto;gap:6px;align-items:center;margin-bottom:8px}
.me-row.novo{grid-template-columns:minmax(0,1fr) 150px auto}
.me-row input,.me-row select,.me-row .csel{min-width:0}
.me-grupo{font-size:15px;margin:18px 0 8px}
.me-grupo span{color:var(--mute);font-weight:400;font-size:13px}
.me-reg{border-color:var(--line);font-size:16px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:8px}
.cat-row.novo{grid-template-columns:minmax(0,1fr) auto;margin-top:12px}
.me-sub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px;margin:-2px 0 14px}
.me-sub select,
.me-sub .csel{font-size:13px;min-width:0}
.me-sub1{margin:-2px 0 14px}
.me-sub1 .btn{width:100%;font-size:13px}
.crit-tab th{text-align:center;font-size:12px;white-space:normal;min-width:56px;line-height:1.2}
.crit-tab td{text-align:center}
.crit-tab td:first-child{text-align:left}
.crit-tab input{width:56px;text-align:center;padding:6px 2px}
.crit-cat{font-size:15px;margin:14px 0 6px}
.crit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:620px){.crit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.me-reg.on{border-color:var(--ink);background:var(--soft)}
@media (max-width:620px){.me-row{grid-template-columns:minmax(0,1fr) auto auto auto auto auto}.me-row:not(.novo)>input{grid-column:1/-1}.me-row.novo{grid-template-columns:minmax(0,1fr) 110px auto}}

/* Partidas (em edição e finalizadas) no mesmo padrão de placar */
.match.fim{border-color:#1f9d55;background:rgba(31,157,85,.07)}
.fim-placar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center}
.fim-lado{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;width:100%;white-space:nowrap;color:var(--ink);font:600 clamp(18px,5vw,30px)/1.1 'Bricolage Grotesque',Figtree,sans-serif}
/* Nome no placar: mesmo tamanho de caixa em andamento e finalizada (igual à lista de escolha) */
.fim-lado .tm{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;box-sizing:border-box;font-weight:inherit;padding:4px 8px;border-radius:10px;border:2px solid transparent}
.tm-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fim-lado.win .tm{border-color:#000}
.fim-lado.win{font-weight:800}
.fim-vazio{color:var(--mute);font-size:.6em;font-weight:600}
.fim-lado select,
.fim-lado .csel{-webkit-appearance:none;appearance:none;width:100%;min-height:44px;box-sizing:border-box;padding:4px 8px;text-align:center;text-align-last:center;font:inherit;color:var(--ink);background:var(--card);border:2px dashed var(--mute);border-radius:10px;cursor:pointer}
.fim-nums{display:flex;align-items:center;gap:8px;font:800 clamp(18px,5vw,30px) 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums;color:var(--mute)}
.fim-nums .win{color:var(--ink)}
.fim-x{font-size:18px;color:var(--mute)}
.fim-desemp{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fim-desemp>span{font:600 12px Figtree,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.fim-desemp-nums{display:flex;align-items:center;gap:8px;font:800 22px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums;color:var(--mute)}
.fim-desemp-nums .win{color:var(--ink)}
/* Placar editável: + em cima, número no meio, − embaixo */
.vst{display:flex;flex-direction:column;align-items:center;gap:4px}
.vst input{width:58px;min-height:46px;padding:2px;text-align:center;font:800 clamp(18px,5vw,30px) 'Bricolage Grotesque',sans-serif;color:var(--ink);-moz-appearance:textfield}
.vst input::-webkit-outer-spin-button,.vst input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.vst .sb{width:46px;height:32px}
.desemp-edit{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);text-align:center}
.desemp-tit{display:block;font-weight:800;font-size:13px;margin-bottom:8px}
.desemp-nums{display:flex;justify-content:center;align-items:center;gap:8px}
.desemp-nums .st input{font:800 18px 'Bricolage Grotesque',sans-serif}
@media (max-width:380px){.vst input{width:50px}.vst .sb{width:40px}}
.fim-campos{border-left:3px solid #1f9d55;padding-left:10px}
.fim-campos input:disabled,.fim-campos select:disabled,.fim-campos .csel:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--card);border-color:var(--line);cursor:default}
.fim-campos button:disabled:not(.csel){visibility:hidden}
.fim-campos .filters{display:none}

/* Janela do regulamento */
.reg-dlg{border:1px solid var(--line);border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink);overflow:hidden}
.reg-dlg::backdrop{background:rgba(10,15,30,.55)}
.reg-box{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.reg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.reg-head h2{font-size:18px}
.reg-body{padding:16px;overflow:auto;white-space:pre-wrap;line-height:1.6;font-size:15px}
.reg-body textarea{width:100%;min-height:50vh;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.cx-dlg{width:min(440px,calc(100vw - 24px))}
.cx-body{font-size:15px}
.reg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

/* Listas suspensas do próprio site */
.csel{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none;line-height:1.2}
.csel-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.csel-arr{font-size:.75em;opacity:.65;flex:none}
.fim-lado .csel,.side .csel{justify-content:center}
.fim-lado .csel .csel-txt,.side .csel .csel-txt{flex:0 1 auto}
select[data-csel]{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;opacity:0;pointer-events:none;overflow:hidden}
.csel-pop{position:fixed;z-index:1000;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;max-height:min(50vh,320px);overflow:auto}
.csel-op{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;font:600 14px Figtree,sans-serif;color:var(--ink);cursor:pointer;min-height:40px}
.csel-op:hover,.csel-op:focus-visible{background:var(--soft);outline:none}
.csel-op[aria-selected=true]{background:var(--ink);color:var(--bg)}

/* Placar das partidas no celular: nome em cima e placar embaixo,
   nome sempre em uma linha e nada passando da largura da tela */
.fim-lado .tm{max-width:100%}
@media (max-width:620px){
 .fim-placar{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"la x lb" "sa x sb";column-gap:8px;row-gap:10px}
 .fim-placar>.fim-lado:first-child{grid-area:la}
 .fim-placar>.fim-lado:last-child{grid-area:lb}
 .fim-placar>.fim-nums{display:contents;font-size:clamp(26px,8vw,34px)}
 .fim-placar>.fim-nums>:first-child{grid-area:sa;justify-self:center}
 .fim-placar>.fim-nums>.fim-x{grid-area:x;align-self:center}
 .fim-placar>.fim-nums>:last-child{grid-area:sb;justify-self:center}
 .fim-lado{font-size:clamp(15px,4.8vw,22px)}
 .vst{flex-direction:row;gap:4px}
 .vst .sb[data-d="-1"]{order:-1}
 .vst .sb[data-d="1"]{order:1}
 .vst .sb{width:clamp(28px,9vw,36px);height:40px}
 .vst input{width:clamp(36px,11vw,46px);min-height:40px;font-size:clamp(18px,5.5vw,24px)}
 .match{padding:12px 8px}
}

/* Integrantes */
.mem-tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin:6px 0 10px}
.mem-tools .busca{grid-column:1/-1}
.mem-grupo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 8px}
.mem-grupo h3{font-size:16px}
.mem-grupo span{font-size:13px;color:var(--mute)}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mem-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;width:100%;font:inherit;min-height:0}
.mem-card:hover{border-color:var(--ink)}
.mem-foto{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font:800 18px 'Bricolage Grotesque',sans-serif;color:var(--mute);overflow:hidden}
.mem-info{min-width:0;display:flex;flex-direction:column}
.mem-nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-form{display:grid;gap:12px}
.mem-form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.mem-foto-ed{display:flex;flex-direction:column;align-items:center;gap:10px}
.mem-foto-ed .mem-foto{width:112px;height:112px;font-size:38px}
.mem-foto-bts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mem-foot{flex-wrap:wrap}
.mem-esp{flex:1}
#permlista{grid-template-columns:1fr}
.cam-video{width:100%;max-height:60vh;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}
.cam-video.espelho{transform:scaleX(-1)}

/* Cards de acesso nas Configurações (Integrantes e Modalidades lado a lado) */
.cfg-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cfg-cards .panel{margin:0;display:flex;flex-direction:column}
.cfg-cards .panel .row{margin-top:auto;margin-bottom:0}
@media (max-width:620px){.cfg-cards{gap:8px}.cfg-cards .panel{padding:12px 10px}.cfg-cards .panel h2{font-size:17px}.cfg-cards .muted{font-size:12px}.cfg-cards .btn{white-space:normal;justify-content:center;text-align:center}}

/* Inserção em massa */
.massa-txt{width:100%;min-height:180px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;line-height:1.5}
.massa-resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.massa-resumo div{background:var(--soft);border-radius:8px;padding:8px;text-align:center;min-width:0}
.massa-resumo span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.massa-resumo strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.massa-total{margin:4px 0 8px;text-align:center}
.massa-check{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px;text-align:left}
.massa-check input{flex:none;margin-top:2px}
.massa-lista{border:1px solid var(--line);border-radius:10px;max-height:40vh;overflow:auto}
.massa-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.massa-item:last-child{border-bottom:0}
.massa-item span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.massa-tag{flex:none;font-size:11px;color:#1f9d55;font-weight:600}
.massa-item.fora span:first-child{color:var(--mute);text-decoration:line-through;font-weight:400}
.massa-item.fora .massa-tag{color:var(--mute)}

/* Modalidades extra e visualização de integrantes */
.ex-cell{grid-column:span var(--n,3)}
.ex-form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 84px auto;gap:6px;align-items:center;margin:8px 0 12px}
@media (max-width:620px){.ex-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ex-form #exdesc{grid-column:1/-1}.ex-form .btn{grid-column:1/-1}}
.ex-cfg{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;font-size:13px;color:var(--mute);font-weight:600}
.mem-card.ro{cursor:default}
.mem-card.ro:hover{border-color:var(--line)}
#tabs a[aria-label="Configurações"]{font-size:18px;padding:8px 12px}
@media (max-width:620px){#tabs{gap:4px;flex-wrap:nowrap}#tabs a{padding:8px 10px;font-size:13px;white-space:nowrap}#tabs a[aria-label="Configurações"]{font-size:16px;padding:8px 9px}}
@media (max-width:380px){#tabs a{padding:7px 8px;font-size:12px;min-height:36px}#tabs a[aria-label="Configurações"]{font-size:15px;padding:7px 8px}}

/* Instagram e Torcida famosa no editor */
.fx-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fx-row:last-child{border-bottom:0}
.fx-pts{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-weight:600}
.fx-pts input{width:84px}
.fx-vis{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
@media (max-width:620px){.fx-row{grid-template-columns:minmax(0,1fr) auto auto auto}.fx-row strong{grid-column:1/-1}}

/* Ícones */
.ico{display:block;flex:none}
.me-ico{display:inline-flex;align-items:center;justify-content:center;border-color:var(--line);color:var(--ink)}
.me-vis.off{color:var(--mute);background:var(--soft)}
.me-row.oculta input[data-mn]{color:var(--mute)}
#tabs a[aria-label="Configurações"]{display:inline-flex;align-items:center;justify-content:center}

/* Ordem da lista de modalidades: botão só com ícone */
.ord-ico{position:relative;display:inline-flex}
.ord-ico .csel{width:40px;min-width:40px;height:40px;min-height:40px;padding:0;border-radius:999px;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.ord-ico.ativo .csel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ord-ico .csel-txt,.ord-ico .csel-arr{display:none}
.ord-ico .csel::before{content:"";width:18px;height:18px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m21%2016-4%204-4-4%22/%3E%3Cpath%20d%3D%22M17%2020V4%22/%3E%3Cpath%20d%3D%22m3%208%204-4%204%204%22/%3E%3Cpath%20d%3D%22M7%204v16%22/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m21%2016-4%204-4-4%22/%3E%3Cpath%20d%3D%22M17%2020V4%22/%3E%3Cpath%20d%3D%22m3%208%204-4%204%204%22/%3E%3Cpath%20d%3D%22M7%204v16%22/%3E%3C/svg%3E") center/contain no-repeat}

/* Inscrições */
.insc-topo{display:flex;align-items:center;gap:12px}
.insc-topo .mem-info{flex:1}
.insc-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.insc-mod{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.insc-mod input,.insc-row input{width:22px;height:22px;flex:none;accent-color:#1f9d55}
.insc-mod:has(input:checked){border-color:#1f9d55;background:rgba(31,157,85,.08)}
.insc-resumo{text-align:center;margin:0 0 4px}
.insc-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.insc-row .mem-foto{width:40px;height:40px;font-size:15px}
.insc-row:has(input:checked) .mem-nome{color:#1f9d55}
.insc-cand{grid-template-columns:1fr}

/* Inscritos na partida */
.insc-tog{display:flex;align-items:center;gap:6px;margin:10px auto 0;background:none;border:0;color:var(--mute);font:600 13px Figtree,sans-serif;cursor:pointer;padding:4px 10px;border-radius:999px;min-height:32px}
.insc-tog:hover{color:var(--ink)}
.insc-tog .seta{display:inline-block;font-size:16px;line-height:1;transition:transform .15s}
.insc-tog[aria-expanded=true] .seta{transform:rotate(90deg)}
.insc-part{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);text-align:left}
.insc-col h4{display:flex;justify-content:flex-start;align-items:baseline;gap:6px;margin:0 0 4px;font:600 12px Figtree,sans-serif;color:var(--mute)}
.insc-col h4 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.insc-col h4 span:last-child{flex:none;color:var(--ink);font-weight:600}
.insc-lin{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;cursor:pointer;min-width:0}
.insc-lin input{width:18px;height:18px;min-height:0;flex:none;accent-color:#1f9d55}
.insc-lin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insc-lin input:checked + span{color:#1f9d55;font-weight:600}
.insc-vazio{margin:4px 0;font-size:12px;color:var(--mute)}
.insc-del{width:30px;height:30px;min-height:30px;margin-left:auto;flex:none}
@media (prefers-reduced-motion:reduce){.insc-tog .seta{transition:none}}

.sorteio-feito{margin:0 0 12px}

.insc-geral{margin-top:6px;text-align:center}
.insc-part.insc-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.insc-part.insc-4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Agenda das modalidades */
.ag{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:12px;color:var(--mute)}
.ag span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.ag .ico{width:13px;height:13px}
.act .ag{justify-content:flex-start}
.ag-pag{margin:2px 0 0}
.ag-pag .ag{justify-content:center;font-size:13px}
.me-ag.on{border-color:var(--ink);background:var(--soft)}
.ag-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.act>div:first-child .ag{justify-content:center}}

/* Locais, árbitros e agenda por categoria */
.cad-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cad-cards .panel{margin:0}
@media (max-width:620px){.cad-cards{grid-template-columns:1fr}}
.cad-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:8px}
.cad-row.novo{margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
#cadbody .muted{text-align:left}
.ag-sec{font-size:15px;margin:4px 0 8px;text-align:left}
.ag-sec span{display:block;font:400 12px Figtree,sans-serif;color:var(--mute);margin-top:2px}
.ag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.ag-grid label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mute);text-align:left}
.ag-dica{font-style:normal;font-weight:400}
.ag-cat{border-top:1px solid var(--line);padding-top:10px;text-align:left}
.ag-cat strong{display:block;margin-bottom:6px;font-size:14px}

.ag-por{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:4px 0 12px;cursor:pointer;text-align:left}
.ag-por input{width:20px;height:20px;min-height:0;flex:none}
.ag-cats[hidden]{display:none}

/* Nova modalidade e categorias da modalidade */
.nv-topo{margin:4px 0 16px}
.nv-tit{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px;text-align:left}
.nv-chips{display:flex;flex-wrap:wrap;gap:6px}
.nv-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.nv-chip input{width:18px;height:18px;min-height:0;accent-color:#1f9d55}
.nv-chip:has(input:checked){border-color:#1f9d55;background:rgba(31,157,85,.08)}
.cell.off{opacity:.3;border-style:dotted;pointer-events:none}
[hidden]{display:none!important}
.mem-form .nv-chip{display:inline-flex;color:var(--ink)}
.mem-form .ag-por{display:flex;color:var(--ink)}

/* Editor: cada modalidade num cartão, com as opções do tipo dentro dele */
.me-item{border:1px solid color-mix(in srgb,var(--line) 60%,var(--mute));border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card);box-shadow:0 1px 3px rgba(20,33,61,.08)}
.me-item .me-row{margin-bottom:0}
.me-item .me-sub,.me-item .me-sub1{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.me-item.oculta{background:var(--soft)}
.nv-crit .crit-grid{margin-top:0}

/* Inscrever na hora: filtro por equipe e seleção múltipla */
.cand-filtros{justify-content:flex-start;margin:0 0 8px}
.cand-filtros .chipbtn{min-height:34px;padding:6px 12px;font-size:13px}
.insc-cand-lista{display:grid}
.cand-todos{justify-self:end;background:none;border:0;color:var(--mute);font:600 13px Figtree,sans-serif;cursor:pointer;padding:4px 2px;min-height:32px}
.cand-todos:hover{color:var(--ink)}
.insc-row.cand:has(input:checked){background:rgba(31,157,85,.07)}
.insc-row.cand:has(input:checked) .mem-nome{color:#1f9d55}
/* Confirmação digitada (Zerar tudo) */
.cx-dig{display:grid;gap:6px;margin-top:14px;white-space:normal;font-size:13px;font-weight:600;color:var(--mute);text-align:left}
.cx-dig strong{color:var(--ink)}

/* ==========================================================================
   CAMADA MODERNA: visual renovado e animações (não altera nenhuma função)
   ========================================================================== */
:root{--acc:#2563eb;--ok:#1f9d55;--r-lg:18px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--sh:0 1px 2px rgba(15,28,54,.05),0 10px 28px -14px rgba(15,28,54,.22);--sh-hi:0 2px 6px rgba(15,28,54,.08),0 22px 44px -18px rgba(15,28,54,.38)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#6d95ff;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);--sh-hi:0 2px 6px rgba(0,0,0,.45),0 22px 44px -18px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--acc:#6d95ff;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);--sh-hi:0 2px 6px rgba(0,0,0,.45),0 22px 44px -18px rgba(0,0,0,.75)}
body,.wrap{overflow-x:clip}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
button:focus-visible,a:focus-visible,.csel:focus-visible{outline-color:var(--acc)}

/* Topo: título com as faixas das quatro equipes, como pistas de corrida */
header{padding-top:8px}
header h1{font-size:clamp(28px,7vw,54px);letter-spacing:-.035em;animation:subir .6s var(--ease) both}
header h1 a{transition:opacity .2s}
header h1 a:hover{opacity:.82}
header h1::after{content:"";display:block;width:min(240px,56vw);height:14px;margin:14px auto 2px;border-radius:5px;background:linear-gradient(to bottom,var(--t0) 0 22%,transparent 22% 26%,var(--t1) 26% 48%,transparent 48% 52%,var(--t2) 52% 74%,transparent 74% 78%,var(--t3) 78% 100%);animation:pistas 1.1s var(--ease) .25s both}
header p{display:inline-flex;align-items:center;gap:8px;animation:subir .6s var(--ease) .1s both}
#sub.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;animation:pulso 2.4s ease-out infinite}

/* Menu fixo no topo, com vidro fosco */
#tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;width:fit-content;max-width:100%;margin:18px auto 20px;padding:5px;gap:4px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:var(--sh);animation:subir .6s var(--ease) .15s both}
#tabs:empty{position:static;display:block;width:auto;margin:10px 0;padding:0;border:0;background:none;box-shadow:none;animation:none}
#tabs a{border-color:transparent;background:transparent;transition:background-color .25s var(--ease),color .25s var(--ease),transform .15s var(--ease),box-shadow .25s}
#tabs a:hover{background:var(--soft)}
#tabs a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--ink) 60%,transparent)}
#tabs a:active{transform:scale(.95)}
@media (max-width:620px){#tabs{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}#tabs::-webkit-scrollbar{display:none}}

/* Painéis */
.panel{border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px}
.panel h2{font-size:21px;letter-spacing:-.02em}
.ptitle{letter-spacing:-.03em}
.back{text-decoration:none;padding:4px 10px;border-radius:999px;transition:background-color .2s}
.back:hover{background:var(--soft)}
@media (max-width:620px){.panel{padding:14px 12px;border-radius:16px}}

/* Entrada de página (só ao trocar de página, nunca nas atualizações em tempo real) */
#main.entrar>*{animation:subir .5s var(--ease) both}
#main.entrar>*:nth-child(2){animation-delay:.06s}
#main.entrar>*:nth-child(3){animation-delay:.12s}
#main.entrar>*:nth-child(4){animation-delay:.18s}
#main.entrar>*:nth-child(5){animation-delay:.24s}
#main.entrar>*:nth-child(n+6){animation-delay:.3s}
@keyframes subir{from{opacity:0;transform:translateY(12px)}}
@keyframes pistas{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(31,157,85,.5)}70%,100%{box-shadow:0 0 0 8px rgba(31,157,85,0)}}
@keyframes fade{from{opacity:0}}

/* Classificação geral: medalhas e barras de corrida */
.race{gap:14px}
.rrow{grid-template-columns:38px 1fr auto;gap:12px}
.rpos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;justify-self:center;font-size:16px;background:var(--soft);color:var(--mute)}
.race .rrow:nth-child(1) .rpos{background:linear-gradient(145deg,#ffe28a,#f2b631);color:#4a3300;box-shadow:0 4px 12px -4px rgba(242,182,49,.75)}
.race .rrow:nth-child(2) .rpos{background:linear-gradient(145deg,#f1f4f8,#b9c3d1);color:#26303f;box-shadow:0 4px 12px -5px rgba(120,135,160,.7)}
.race .rrow:nth-child(3) .rpos{background:linear-gradient(145deg,#f4cba3,#c8874e);color:#45260c;box-shadow:0 4px 12px -5px rgba(200,135,78,.7)}
.rname{font-size:16px;margin-bottom:6px}
.bar{height:16px;border-radius:999px;position:relative;overflow:hidden}
.grow .bar{animation:g 1s var(--ease) both}
.grow .race .rrow:nth-child(2) .bar{animation-delay:.08s}
.grow .race .rrow:nth-child(3) .bar{animation-delay:.16s}
.grow .race .rrow:nth-child(4) .bar{animation-delay:.24s}
.race .rrow:first-child .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:brilho 1.4s var(--ease) 1.1s both}
@keyframes brilho{to{transform:translateX(100%)}}
.rpts{font-size:26px;letter-spacing:-.02em;min-width:3ch;text-align:right}
@media (max-width:620px){.rrow{grid-template-columns:30px 1fr auto;gap:8px}.rpos{width:28px;height:28px;font-size:14px}.rpts{font-size:20px}}

/* Tabelas */
table{border-collapse:separate;border-spacing:0}
thead th{font-size:12px;letter-spacing:.02em}
tbody tr{transition:background-color .2s}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 70%,transparent)}
tfoot td{background:var(--soft)}
tfoot td:first-child{border-radius:10px 0 0 10px}
tfoot td:last-child{border-radius:0 10px 10px 0}

/* Botões, chips e campos */
.btn,.chipbtn,.sb,.cell,.mem-card,.catnav a,.csel,.sw,.nv-chip,.insc-mod,.me-item{transition:transform .15s var(--ease),background-color .2s,border-color .2s,box-shadow .2s,color .2s,opacity .2s}
.btn{border-radius:10px}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn:not(:disabled):active,.chipbtn:not(:disabled):active,.sb:not(:disabled):active,.catnav a:active{transform:scale(.95)}
.chipbtn:hover{border-color:var(--ink)}
.chipbtn[aria-pressed=true],.catnav a[aria-current=page]{box-shadow:0 4px 12px -5px color-mix(in srgb,var(--ink) 55%,transparent)}
.sb:not(:disabled):hover{border-color:var(--ink);background:var(--card)}
.sw:not([aria-pressed=true]):hover{transform:scale(1.12)}
input,select,textarea,.csel{transition:border-color .2s,box-shadow .2s,background-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);outline:none}
input[type=checkbox]{accent-color:var(--acc)}
input[type=checkbox]:focus{box-shadow:none}

/* Lista de modalidades */
.act{padding:12px 6px;transition:background-color .2s}
.act:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.act strong{font-size:15.5px}
.cell{border-radius:11px}
.cell.done{background:var(--card);border-color:color-mix(in srgb,var(--ok) 55%,var(--line));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 15%,transparent)}
.cell:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--ink)}
.chip{border-radius:5px}
#main.entrar .chip{animation:chipIn .45s var(--spring) .3s both}
@keyframes chipIn{from{transform:scale(.3);opacity:0}}

/* Partidas */

 /* Grava somente as colunas alteradas, logo após reler a versão mais recente do servidor.
    Assim, quem edita o Instagram não sobrescreve quem edita a Torcida ou as Configurações. */
 async patchCfg(cols, mutate) {
  try {
   if (db) {
    const { data, error } = await db.from('cfg').select(cols.join(',')).eq('id', 'geral');
    if (!error && data && data.length) applyCfg(data[0]);
   }
   mutate();
   save();
   if (!db) return;
   const payload = { id: 'geral' };
   cols.forEach(c => payload[c] = S[c]);
   const { error } = await db.from('cfg').upsert(payload);
   if (error) fail(error);
  } catch (e) { fail(e); }
 },

 /* Gravação completa: usada apenas ao zerar o sistema */
 async saveAllCfg() {
  save();
  if (!db) return;
  const payload = { id: 'geral', teams: S.teams, pts: S.pts, fan: S.fan, ig: S.ig, insta: S.insta, fans: S.fans, colors: S.colors };
  const { error } = await db.from('cfg').upsert(payload);
  if (error) fail(error);
 },

 async persistRes(a, ci) {
  save();
  if (!db || !a) return;
  const docId = `${a.s}_${ci}`;
  const payload = { id: docId, d: S.res[rk(a, ci)] || {} };
  const { error } = await db.from('res').upsert(payload);
  if (error) fail(error);
 },

 /* Tempo real focado: cada página escuta somente o que exibe */
 setupRealtime() {
  if (!db) return;
  db.removeAllChannels();
  const nome = cur ? `olimp-m-${cur.s}-${curC}` : `olimp-${pg}`;
  const ch = db.channel(nome);
  const onRes = p => {
   if (p.eventType === 'DELETE') { if (p.old && p.old.id) removeRes(p.old.id); }
   else if (p.new) applyRes(p.new.id, p.new.d);
   save(); softRender();
  };
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'cfg' }, p => {
   if (p.new && p.new.id) { applyCfg(p.new); save(); softRender(); }
  });
  if (cur) {
   ch.on('postgres_changes', { event: '*', schema: 'public', table: 'res', filter: `id=eq.${cur.s}_${curC}` }, onRes);
  } else if (pg === 'placar' || pg === 'mod') {
   ch.on('postgres_changes', { event: '*', schema: 'public', table: 'res' }, onRes);
  } else if (pg === 'membros' || pg === 'memver') {
   ch.on('postgres_changes', { event: '*', schema: 'public', table: 'membros' }, onMem);
  }
  ch.subscribe();
 }
};

/* Evita redesenhar a tela enquanto alguém está digitando ou com rascunho aberto */
const hasDraft = () => cur && !!D[rk(cur, curC)];
const typing = () => {
 const a = document.activeElement;
 return !!a && $('main').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox';
};

 if (carregando) return;
 if (hasDraft()) return;
 if (typing()) { pendente = true; return; }
 rFlex = true; try { render(); } finally { rFlex = false; }   // atualização automática: só troca o que mudou
};

}, 0));

/* ==========================================================================
   3. REGRAS DE NEGÓCIO E CÁLCULO
   ========================================================================== */
function crank(vals, asc) {
 const ix = vals.map((v, i) => [v, i]).filter(x => x[0] != null); if (!ix.length) return null;
 const p = [null, null, null, null]; ix.forEach(([v, i]) => p[i] = 1 + ix.filter(([w]) => asc ? w < v : w > v).length); return p;
}
/* Distância digitada como 12m34cm (ou 12,34) → centímetros */
function pdist(s) {
 s = String(s || '').trim().toLowerCase(); if (!s) return null;
 const m = s.match(/^(\d+)\s*m\s*(\d{1,2})\s*(cm)?$/);
 if (m) return +m[1] * 100 + +m[2];
 const n = num(s.replace(',', '.')); return n == null ? null : Math.round(n * 100);
}
/* Texto curto da regra da modalidade de marca */
const regraMarca = a => a.u === 'dist' ? (a.inv ? 'Distância · menor distância vence' : 'Distância · maior distância vence') : (a.inv ? 'Tempo · maior tempo vence' : 'Tempo · menor tempo vence');
const descTipo = a => a.t == 'marca' ? `Marca · ${regraMarca(a)}` : TN[a.t];

function ptime(s) {
 s = String(s || '').trim(); if (!s) return null;
 if (!/['’:]/.test(s)) return num(s.replace(',', '.'));
 const p = s.split(/['’:]/).map(Number); if (p.some(isNaN)) return null;
 return p.length == 2 ? p[0] * 60 + p[1] : p[0] * 60 + p[1] + (p[2] || 0) / 100;
}
function win(m) {
 if (!m || !m.ok || m.a === '' || m.b === '' || m.a == null || m.b == null) return null;
 const sa = num(m.sa), sb = num(m.sb); if (sa == null || sb == null) return null;
 let w; if (sa != sb) w = sa > sb; else { const da = num(m.da), db = num(m.db); if (da == null || db == null || da == db) return null; w = da > db }
 return w ? [+m.a, +m.b] : [+m.b, +m.a];
}
function chavM(d) {
 const m = d.m || {}, w1 = win(m.s1), w2 = win(m.s2);
 return {s1: m.s1 || {}, s2: m.s2 || {}, t3: {...m.t3, a: w1 ? w1[1] : '', b: w2 ? w2[1] : ''}, f: {...m.f, a: w1 ? w1[0] : '', b: w2 ? w2[0] : ''}};
}
function place(t, d, a) {
 if (!d) return null;
 if (t == 'chav') {
  const x = chavM(d), wf = win(x.f), wt = win(x.t3), p = [null, null, null, null];
  if (wf) { p[wf[0]] = 1; p[wf[1]] = 2 } if (wt) { p[wt[0]] = 3; p[wt[1]] = 4 }
  return p.some(v => v) ? p : null;
 }
 if (!d.ok) return null;
 if (t == 'rank') { const r = T.map(i => num(d.p?.[i]) || null); return r.some(x => x) ? r : null }
 if (t == 'pontos' && d.modo === 'class') { const r = T.map(i => num(d.p?.[i]) || null); return r.some(x => x) ? r : null }
 if (t == 'pontos') return crank(T.map(i => num(d.v?.[i])), false);
 if (t == 'crit' && d.modo === 'class') { const r = T.map(i => num(d.p?.[i]) || null); return r.some(x => x) ? r : null }
 if (t == 'crit') return crank(T.map(i => { const c = d.c?.[i]; return c && c.some(x => x !== '' && x != null) ? c.reduce((a, b) => a + (+b || 0), 0) : null }), false);
 if (t == 'marca' && d.modo === 'class') { const r = T.map(i => num(d.p?.[i]) || null); return r.some(x => x) ? r : null }
 if (t == 'marca') {
  /* tempo: menor vence (invertido: maior) · distância: maior vence (invertido: menor) */
  const cfg = a || cur || {}, dist = cfg.u === 'dist', menorVence = dist ? !!cfg.inv : !cfg.inv;
  const ler = dist ? pdist : ptime, b = [null, null, null, null];
  (d.e || []).forEach(e => { const s = ler(e?.t); if (s != null && e.team !== '' && e.team != null) { const i = +e.team; if (b[i] == null || (menorVence ? s < b[i] : s > b[i])) b[i] = s } });
  return crank(b, menorVence);
 }
}
const ready = (t, d) => { const p = place(t, {...d, ok: true}); return t == 'marca' && d.modo !== 'class' ? !!p : !!p && p.every(Boolean) };
function totals() {
 const cat = {}; let done = 0; CATS.forEach(c => cat[c.id] = [0,0,0,0]);
 ACTS.forEach(a => CATS.filter(c => temCat(a, c.id)).forEach(c => { const p = place(a.t, S.res[rk(a, c.id)], a); if (p) { done++; p.forEach((x, i) => { if (x) cat[c.id][i] += S.pts[x-1] || 0 }) } }));
 const ig = T.map(i => (S.insta[i] || []).filter(Boolean).length * S.ig), fn = T.map(i => (S.fans || []).filter(f => +f.team === i).length * S.fan);
 const ex = ACTS.filter(a => a.t == 'extra').map(a => ({n: a.n, v: extraSoma(a)}));
 return {cat, ig, fn, ex, done, tot: T.map(i => CATS.reduce((a, c) => a + cat[c.id][i], 0) + ig[i] + fn[i] + ex.reduce((s, x) => s + x.v[i], 0))};
}

const chips = p => `<span class="chips">${p ? T.filter(i => p[i]).sort((a, b) => p[a] - p[b] || a - b).map(i => `<span class="chip" style="--c:var(--t${i})" title="${tn(i)}">${p[i]}º</span>`).join('') : '—'}</span>`;

 },

/* Componentes auxiliares para renderizar cada modalidade */
const TO = () => [['','—'], ...T.map(i => [i, S.teams[i]])];
const I = (k, v, x='') => `<input data-k="${k}" value="${esc(v??'')}" ${x}>`;
const ST = (k, v, dis) => `<span class="st"><button class="sb" data-step="${k}" data-d="-1" ${dis?'disabled':''} aria-label="Diminuir">−</button><input data-k="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="–" value="${v??''}" ${dis?'disabled':''}><button class="sb" data-step="${k}" data-d="1" ${dis?'disabled':''} aria-label="Aumentar">+</button></span>`;
const SEL = (k, v, opts, dis, taken=[]) => `<select data-k="${k}" ${dis?'disabled':''}>${opts.filter(([val]) => val===''||String(val)===String(v??'')||!taken.includes(String(val))).map(([val, l]) => `<option value="${val}" ${String(v??'')===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const who = t => `<span style="width:120px;display:inline-flex;align-items:center;font-weight:600">${tn(t)}</span>`;

/* Placar de uma partida já finalizada (somente leitura) */
function mfim(x, m, label) {
 const w = win(m), ga = !!w && w[0] === +m.a, gb = !!w && w[0] === +m.b;
 const lado = (t, g) => `<div class="fim-lado ${g?'win':''}">${TM(t)}</div>`;
 const tie = num(m.sa) === num(m.sb);
 return `<div class="match fim"><h3>${label}</h3>
 <div class="fim-placar">${lado(m.a, ga)}<div class="fim-nums"><span class="${ga?'win':''}">${num(m.sa)}</span><span class="fim-x">×</span><span class="${gb?'win':''}">${num(m.sb)}</span></div>${lado(m.b, gb)}</div>
 ${tie ? `<div class="fim-desemp"><span>Desempate</span><div class="fim-desemp-nums"><span class="${ga?'win':''}">${num(m.da)}</span><span class="fim-x">×</span><span class="${gb?'win':''}">${num(m.db)}</span></div></div>` : ''}
 <div class="row" style="margin-top:10px"><button class="btn alt" data-edit="${x}">Editar</button></div>${inscPartidaHTML(x, m)}</div>`;
}

/* Placar editável vertical: + em cima, número, − embaixo */
const VST = (k, v, dis) => `<span class="vst"><button class="sb" data-step="${k}" data-d="1" ${dis?'disabled':''} aria-label="Aumentar">+</button><input data-k="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="–" value="${v??''}" ${dis?'disabled':''}><button class="sb" data-step="${k}" data-d="-1" ${dis?'disabled':''} aria-label="Diminuir">−</button></span>`;

/* Partida em andamento: mesmo layout da finalizada, com os botões +/− */
function mrow(x, m, sel, label, d) {
 m = m || {};
 if (m.ok && win(m)) return mfim(x, m, label);
 const lock = !!m.ok, has = m.a!=='' && m.a!=null && m.b!=='' && m.b!=null;
 const tie = num(m.sa)!=null && num(m.sa)===num(m.sb), dis = lock || !has;
 const slots = ['s1','s2'].flatMap(s => ['a','b'].map(z => [s+z, d.m?.[s]?.[z]]));
 const fixo = !!(d.sorteio && (x == 's1' || x == 's2'));
 const pick = z => SEL(`m.${x}.${z}`, m[z], TO(), lock || fixo, slots.filter(s => s[0]!=x+z).map(s => s[1]).filter(v => v!==''&&v!=null).map(String));
 const vazio = z => m[z]==='' || m[z]==null;
 const lado = z => `<div class="fim-lado">${sel && !(fixo && !vazio(z)) ? corSel(pick(z), m[z]) : (vazio(z) ? '<span class="fim-vazio">A definir</span>' : TM(m[z]))}</div>`;
 const desemp = has && tie ? `<div class="desemp-edit"><span class="desemp-tit">Empate! Informe o desempate</span><div class="desemp-nums">${ST(`m.${x}.da`, m.da, dis)}<span class="fim-x">×</span>${ST(`m.${x}.db`, m.db, dis)}</div></div>` : '';
 return`<div class="match"><h3>${label}</h3>
 <div class="fim-placar">${lado('a')}<div class="fim-nums">${VST(`m.${x}.sa`, m.sa, dis)}<span class="fim-x">×</span>${VST(`m.${x}.sb`, m.sb, dis)}</div>${lado('b')}</div>
 ${desemp}
 <div class="row" style="margin-top:12px">${lock?`<span class="ok">✔ Resultado confirmado</span><button class="btn alt" data-edit="${x}">Editar</button>`:`<button class="btn" data-conf="${x}" ${win({...m, ok:true})?'':'disabled'}>Salvar resultado</button>`}</div>${inscPartidaHTML(x, m)}</div>`;
}

function secHTML(ci) {
 if (cur.t == 'extra') return extraHTML(cur);

 if (a.t == 'rank') h = rankHTML(d, lock);
 if (a.t == 'pontos') h = pontosHTML(d, lock);
 if (a.t == 'crit') h = critHTML(a, ci, d, lock);

 if (a.t == 'marca') h = marcaHTML(a, d, lock);


 if (a.t == 'chav') {

 }

 return (lock ? `<div class="fim-campos">${h}</div>` : h) + pvHTML(a.t, d, lock) + foot + `<div class="insc-geral">${inscBlocoHTML('g', T)}</div>`;
}

/* Marca ou pontuação final de cada equipe, para mostrar na classificação */
function valorFinal(t, d, a) {
 const fmt = v => (Math.round(v * 100) / 100).toLocaleString('pt-BR') + ' pts';
 if (t == 'pontos' && d.modo === 'class') return null;
 if (t == 'pontos') return T.map(i => { const v = num(d.v?.[i]); return v == null ? '' : fmt(v); });
 if (t == 'crit' && d.modo === 'class') return null;
 if (t == 'crit') return T.map(i => { const c = d.c?.[i]; return c && c.some(x => x !== '' && x != null) ? fmt(c.reduce((s, b) => s + (+b || 0), 0)) : ''; });
 if (t == 'marca' && d.modo === 'class') return null;
 if (t == 'marca') {

let xlsxProm = null;
function carregarXLSX() {

  document.head.appendChild(s);

}

const eqNome = i => i === '' || i == null || S.teams[+i] == null ? '' : S.teams[+i];

/* Linhas de uma categoria de uma modalidade */
function planCategoria(a, c) {
 const d = S.res[rk(a, c.id)] || {}, L = [], p = place(a.t, d, a);
 const cls = d.modo === 'class';
 L.push([c.n]);
 if (a.t == 'chav') {
  const x = chavM(d), feitas = ['s1', 's2', 't3', 'f'].filter(k => x[k] && x[k].ok && win(x[k])).length;
  L.push(['Situação', feitas == 4 ? 'Confirmado' : feitas ? `${feitas} de 4 partidas confirmadas` : 'Sem resultado confirmado']);
  L.push([]);
  L.push(['Partida', 'Equipe A', 'Placar A', 'Placar B', 'Equipe B', 'Desempate A', 'Desempate B', 'Vencedor']);
  [['s1', 'Semifinal 1'], ['s2', 'Semifinal 2'], ['t3', 'Disputa de 3º lugar'], ['f', 'Final']].forEach(([k, n]) => {
   const m = x[k] || {}, w = win(m), ok = !!(m.ok && w);
   const tie = ok && num(m.sa) === num(m.sb);
   L.push([n, eqNome(m.a) || 'A definir', ok ? num(m.sa) : '', ok ? num(m.sb) : '', eqNome(m.b) || 'A definir', tie ? num(m.da) : '', tie ? num(m.db) : '', ok ? eqNome(w[0]) : 'Pendente']);
  });
 } else {
  L.push(['Situação', d.ok ? 'Confirmado' : 'Sem resultado confirmado']);
  if (d.ok && !cls) {
   L.push([]);
   if (a.t == 'marca') {
    L.push(['Atleta', 'Equipe', a.u == 'dist' ? 'Distância' : 'Tempo']);
    (d.e || []).filter(e => e && (e.t || e.n || (e.team !== '' && e.team != null))).forEach(e => L.push([e.n || '', eqNome(e.team), e.t || '']));
   } else if (a.t == 'crit') {
    const nomes = critNomes(a, c.id);
    L.push(['Equipe', ...nomes, 'Total']);
    T.forEach(t => { const v = d.c?.[t] || []; L.push([eqNome(t), ...nomes.map((_, k) => num(v[k]) ?? ''), v.some(x => x !== '' && x != null) ? Math.round(v.reduce((s, b) => s + (+b || 0), 0) * 100) / 100 : '']); });
   } else if (a.t == 'pontos') {
    L.push(['Equipe', 'Pontuação']);
    T.forEach(t => L.push([eqNome(t), num(d.v?.[t]) ?? '']));
   }
  }
 }
 L.push([]);
 L.push(['Classificação']);
 if (p) {
  const vf = a.t == 'chav' ? null : valorFinal(a.t, d, a);
  L.push(vf ? ['Posição', 'Equipe', 'Resultado', 'Pontos ganhos'] : ['Posição', 'Equipe', 'Pontos ganhos']);

}

function planModalidade(a) {

/* Nome de aba válido no Excel: até 31 caracteres, sem : \ / ? * [ ] e sem repetir */
function nomeAba(n, usados) {
 let base = String(n || 'Aba').replace(/[:\\\/?*\[\]]/g, '-').trim().slice(0, 31) || 'Aba', nome = base, k = 2;
 while (usados.has(nome.toLowerCase())) { const suf = ` (${k++})`; nome = base.slice(0, 31 - suf.length) + suf; }
 usados.add(nome.toLowerCase());
 return nome;
}

/* Apaga os resultados de uma modalidade nas três categorias */
async function apagarResultados(id) {
 [...CATS.map(c => c.id), EXTRA_CI].forEach(ci => { delete S.res[id + '|' + ci]; delete D[id + '|' + ci]; });
 save();
 if (!db) return;

}

/* Regulamentos: tabela própria (reg), lida só quando alguém abre o regulamento */
const REG = {
 async get(id) {
  if (!db) return (S.regs || {})[id] || '';
  const { data, error } = await db.from('reg').select('txt').eq('id', id);
  if (error) throw error;
  return data && data.length ? (data[0].txt || '') : '';
 },
 async set(id, txt) {
  if (!db) {
   S.regs = S.regs || {};
   if (txt) S.regs[id] = txt; else delete S.regs[id];
   save(); return true;
  }
  const { error } = txt
   ? await db.from('reg').upsert({ id, txt, updated_at: new Date().toISOString() })
   : await db.from('reg').delete().eq('id', id);
  if (error) { fail(error); return false; }
  return true;
 }
};

/* ==========================================================================
   8. CORES DAS EQUIPES (fundo nos placares e classificações, texto sempre preto)
   ========================================================================== */
function lum(h) {
 const c = [1,3,5].map(i => parseInt(h.slice(i, i+2), 16) / 255).map(v => v <= .03928 ? v/12.92 : ((v + .055) / 1.055) ** 2.4);
 return .2126*c[0] + .7152*c[1] + .0722*c[2];
}
/* Aceita só cores claras, com bom contraste para texto preto */
function corOk(h) { return /^#[0-9a-f]{6}$/i.test(String(h || '')) && (lum(h) + .05) / .05 >= 7; }
function corEquipe(i) { const c = (S.colors || [])[i]; return corOk(c) ? c.toLowerCase() : CORES_PADRAO[i]; }
function aplicarCores() { T.forEach(i => document.documentElement.style.setProperty('--t' + i, corEquipe(i))); }

/* Escolha da cor pela paleta (Configurações) */
document.addEventListener('click', e => {
 const b = e.target.closest('[data-sw]'); if (!b) return;
 const [i, cor] = b.dataset.sw.split(','); if (!corOk(cor)) return;
 b.closest('.sws').querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b));
 document.documentElement.style.setProperty('--t' + i, cor);
 DB.patchCfg(['colors'], () => { S.colors = T.map(j => corEquipe(j)); S.colors[+i] = cor; aplicarCores(); }).then(softRender);
});

aplicarCores();

document.body.insertAdjacentHTML('beforeend', '<dialog id="cxdlg" class="reg-dlg cx-dlg" aria-label="Confirmação"></dialog>');
function caixa(msg, ok, cancelar) {
 return new Promise(res => {
  const dlg = $('cxdlg');
  dlg.innerHTML = `<div class="reg-box"><div class="reg-body cx-body">${esc(msg)}</div><div class="reg-foot">${cancelar ? `<button class="btn alt" data-cx="0">${cancelar}</button>` : ''}<button class="btn" data-cx="1">${ok}</button></div></div>`;
  const fim = v => { dlg.onclick = null; dlg.oncancel = null; if (dlg.open) dlg.close(); res(v); };
  dlg.onclick = e => { const b = e.target.closest('[data-cx]'); if (b) fim(b.dataset.cx === '1'); };
  dlg.oncancel = e => { e.preventDefault(); fim(false); };
  if (!dlg.open) dlg.showModal();
  dlg.querySelector('[data-cx="1"]').focus();
 });
}
const confirmar = msg => caixa(msg, 'Confirmar', 'Cancelar');
const avisar = msg => caixa(msg, 'OK');

/* Confirmação que só libera o botão depois de digitar a palavra exata (ex.: "Zerar tudo") */
function confirmarDigitando(msg, palavra) {
 return new Promise(res => {
  const dlg = $('cxdlg'), norm = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  dlg.innerHTML = `<div class="reg-box"><div class="reg-body cx-body">${esc(msg)}<label class="cx-dig"><span>Para confirmar, digite <strong>${esc(palavra)}</strong></span><input id="cxtxt" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(palavra)}"></label></div><div class="reg-foot"><button class="btn alt" data-cx="0">Cancelar</button><button class="btn warn" data-cx="1" disabled>${esc(palavra)}</button></div></div>`;
  const inp = $('cxtxt'), ok = dlg.querySelector('[data-cx="1"]');
  const valido = () => norm(inp.value) === norm(palavra);
  const fim = v => { dlg.onclick = null; dlg.oncancel = null; if (dlg.open) dlg.close(); res(v); };
  inp.oninput = () => { ok.disabled = !valido(); };
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (valido()) fim(true); } };
  dlg.onclick = e => { const b = e.target.closest('[data-cx]'); if (b && !b.disabled) fim(b.dataset.cx === '1'); };
  dlg.oncancel = e => { e.preventDefault(); fim(false); };
  if (!dlg.open) dlg.showModal();
  inp.focus();
 });
}

const NCRIT = 6;
function critNomes(a, ci) {
 const cn = (a && a.cn) || {};
 const l = cn.todos || cn[ci] || Object.values(cn).find(Array.isArray) || [];   // mesmos nomes para todas as categorias
 return Array.from({length: NCRIT}, (_, k) => String(l[k] || '').trim() || `Critério ${k+1}`);
}

/* Linhas de colocação (usadas no Ranking e no modo "só classificação final") */
function rankHTML(d, lock) {
 return T.map(t => `<div class="row" style="justify-content:space-between">${who(t)}<div style="flex:1;max-width:180px">${SEL('p.'+t, d.p?.[t], [['','—'], ...[1,2,3,4].map(n => [n, n+'º lugar'])], lock, T.filter(u => u!=t).map(u => String(d.p?.[u]||'')).filter(Boolean))}</div></div>`).join('');
}

function critHTML(a, ci, d, lock) {
 const cls = d.modo === 'class';
 const tog = `<div class="filters" role="group" aria-label="Forma de lançamento">
  <button class="chipbtn" data-cmodo="notas" aria-pressed="${!cls}" ${lock?'disabled':''}>Notas por critério</button>
  <button class="chipbtn" data-cmodo="class" aria-pressed="${cls}" ${lock?'disabled':''}>Só classificação final</button></div>`;
 if (cls) return tog + `<p class="muted">Informe apenas a colocação final de cada equipe.</p>` + rankHTML(d, lock);
 const nomes = critNomes(a, ci);
 const soma = t => { const c = d.c?.[t]; return c && c.some(x => x !== '' && x != null) ? (Math.round(c.reduce((s, b) => s + (+b || 0), 0) * 100) / 100).toLocaleString('pt-BR') : '–'; };

/* ==========================================================================
   13. LISTAS SUSPENSAS DO PRÓPRIO SITE
   Cada <select> continua existindo (oculto) para a lógica do sistema, mas o que
   aparece e abre é uma lista desenhada pelo site, igual em todos os aparelhos.
   ========================================================================== */
(function () {
 const pVal = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
 const pDis = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'disabled');
 let aberto = null;

 const texto = sel => { const o = sel.options[sel.selectedIndex]; return o ? o.textContent : ''; };
 function sync(sel) {
  const b = sel._csel; if (!b) return;
  b.querySelector('.csel-txt').textContent = texto(sel) || '—';
  b.disabled = pDis.get.call(sel);
  const st = sel.getAttribute('style'); if (st) b.setAttribute('style', st); else b.removeAttribute('style');
 }
 function melhorar(sel) {
  if (sel.dataset.csel) return; sel.dataset.csel = '1';
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'csel';
  b.setAttribute('aria-haspopup', 'listbox'); b.setAttribute('aria-expanded', 'false');
  const lab = sel.getAttribute('aria-label'); if (lab) b.setAttribute('aria-label', lab);
  b.innerHTML = '<span class="csel-txt"></span><span class="csel-arr" aria-hidden="true">▾</span>';
  sel._csel = b; b._sel = sel;
  sel.insertAdjacentElement('afterend', b);
  sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
  /* mantém o botão atualizado quando o código muda o valor ou desativa a lista */
  Object.defineProperty(sel, 'value', {configurable: true, get() { return pVal.get.call(this); }, set(v) { pVal.set.call(this, v); sync(this); }});
  Object.defineProperty(sel, 'disabled', {configurable: true, get() { return pDis.get.call(this); }, set(v) { pDis.set.call(this, v); sync(this); }});
  sel.addEventListener('focus', () => b.focus());
  sel.addEventListener('change', () => sync(sel));
  sync(sel);
 }
 function fechar(foco) {
  if (!aberto) return;
  const {btn, pop} = aberto; aberto = null;
  pop.remove(); btn.setAttribute('aria-expanded', 'false');
  if (foco && document.contains(btn)) btn.focus();
 }
 function abrir(btn) {
  const sel = btn._sel; if (!sel || btn.disabled) return;
  fechar();
  const pop = document.createElement('div');
  pop.className = 'csel-pop'; pop.setAttribute('role', 'listbox');
  [...sel.options].forEach((o, i) => {
   const op = document.createElement('button');
   op.type = 'button'; op.className = 'csel-op'; op.setAttribute('role', 'option');
   op.dataset.cidx = i; op.setAttribute('aria-selected', i === sel.selectedIndex);
   op.textContent = o.textContent; if (o.disabled) op.disabled = true;
   pop.appendChild(op);
  });
  (sel.closest('dialog') || document.body).appendChild(pop);
  posicionar(btn, pop);
  btn.setAttribute('aria-expanded', 'true');
  aberto = {sel, btn, pop};
  (pop.querySelector('[aria-selected=true]') || pop.querySelector('.csel-op')).focus({preventScroll: true});
 }
 /* Posiciona a lista junto do campo (abaixo, ou acima se não couber) */
 function posicionar(btn, pop) {
  const r = btn.getBoundingClientRect(), vv = window.visualViewport;
  /* Limites: a área visível da tela e, dentro de uma janela, a própria janela (a lista não "vaza" por cima dela) */
  let lTop = vv ? vv.offsetTop : 0, lBot = vv ? vv.height + vv.offsetTop : innerHeight;
  const dlg = btn.closest('dialog');
  if (dlg) { const d = dlg.getBoundingClientRect(); lTop = Math.max(lTop, d.top); lBot = Math.min(lBot, d.bottom); }
  pop.style.minWidth = Math.max(r.width, 160) + 'px';
  pop.style.maxHeight = 'none';
  const natural = pop.scrollHeight + 2, abaixo = lBot - r.bottom - 10, acima = r.top - lTop - 10;
  /* Preferência: abrir logo abaixo do campo, rolando por dentro se preciso; só abre para cima quando embaixo não há espaço razoável */
  const minimo = Math.min(natural, 150);   // cerca de 3 a 4 opções visíveis já bastam para abrir embaixo
  let top, alt;
  if (abaixo >= minimo || abaixo >= acima) { alt = Math.max(Math.min(natural, abaixo), Math.min(natural, 120)); top = r.bottom + 4; }
  else { alt = Math.min(natural, acima); top = r.top - 4 - alt; }
  pop.style.maxHeight = alt + 'px';
  pop.style.top = Math.max(lTop + 4, top) + 'px';
  const w = pop.offsetWidth;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  const sel = pop.querySelector('[aria-selected=true]');
  if (sel) pop.scrollTop = Math.max(0, sel.offsetTop - alt / 2);   // opção atual visível dentro da lista
 }


 function escolher(i) {
  const {sel} = aberto; fechar(true);
  if (sel.selectedIndex !== i) {
   sel.selectedIndex = i; sync(sel);
   sel.dispatchEvent(new Event('change', {bubbles: true}));
  }
 }

 document.addEventListener('click', e => {
  const op = e.target.closest('.csel-op');
  if (op && aberto) { escolher(+op.dataset.cidx); return; }
  const b = e.target.closest('.csel');
  if (b) { if (aberto && aberto.btn === b) fechar(true); else abrir(b); return; }
  if (aberto && !e.target.closest('.csel-pop')) fechar();
 });
 document.addEventListener('keydown', e => {
  if (aberto) {
   const ops = [...aberto.pop.querySelectorAll('.csel-op:not(:disabled)')], i = ops.indexOf(document.activeElement);
   if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fechar(true); }
   else if (e.key === 'ArrowDown') { e.preventDefault(); (ops[i + 1] || ops[0]).focus(); }
   else if (e.key === 'ArrowUp') { e.preventDefault(); (ops[i - 1] || ops[ops.length - 1]).focus(); }
   else if (e.key === 'Tab') fechar();
   return;
  }
  const b = e.target.closest && e.target.closest('.csel');
  if (b && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); abrir(b); }
 }, true);
 /* Rolagem ou teclado do celular fechando: a lista acompanha o campo em vez de fechar sozinha */
 const acompanhar = e => { if (aberto && !(e && e.target && e.target.nodeType === 1 && aberto.pop.contains(e.target))) posicionar(aberto.btn, aberto.pop); };
 addEventListener('scroll', acompanhar, true);
 addEventListener('resize', acompanhar);
 if (window.visualViewport) { visualViewport.addEventListener('resize', acompanhar); visualViewport.addEventListener('scroll', acompanhar); }

 const varrer = () => document.querySelectorAll('select:not([data-csel])').forEach(melhorar);
 new MutationObserver(() => { varrer(); if (aberto && !document.contains(aberto.btn)) fechar(); })
  .observe(document.body, {childList: true, subtree: true});
 varrer();
})();

const MEM = {

   const { error } = await db.from('membros').upsert(lista.map(m => ({id: m.id, nome: m.nome, team: m.team, cat: m.cat, turma: m.turma || null, foto: m.foto || null, updated_at: agora})));

 },
 async apagar(id) {

 },

  const { error } = await db.storage.from('fotos').upload(nome, blob, {contentType: 'image/jpeg', cacheControl: '31536000'});

  return db.storage.from('fotos').getPublicUrl(nome).data.publicUrl;
 },

/* ---------- Foto: arquivo ou câmera, recortada em quadrado e reduzida ---------- */
async function reduzir(src) {
 try {
  let img = src, w, h;
  if (src instanceof HTMLVideoElement) { w = src.videoWidth; h = src.videoHeight; }
  else {
   img = await (window.createImageBitmap ? createImageBitmap(src).catch(() => null) : null);
   if (!img) img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = URL.createObjectURL(src); });
   w = img.width; h = img.height;
  }
  if (!w || !h) return null;
  const lado = Math.min(w, h), TAM = 400, c = document.createElement('canvas');
  c.width = c.height = TAM;
  c.getContext('2d').drawImage(img, (w - lado) / 2, (h - lado) / 2, lado, lado, 0, 0, TAM, TAM);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
 } catch (e) { console.error(e); return null; }
}
function definirFoto(blob) {
 memEd.blob = blob;
 memEd.prev = URL.createObjectURL(blob);
 atualizaFotoArea();
}

async function iniciarCam() {
 pararCam();
 try {
  camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: camFrente ? 'user' : 'environment', width: {ideal: 1280}, height: {ideal: 1280}}, audio: false});
 } catch (e) { console.error(e); return false; }

 $('camaviso').textContent = 'Centralize o rosto e toque em Capturar.';
 $('camdlg').querySelector('[data-camcap]').disabled = false;
 return true;
}

/* Reconhece os nomes: um por linha, sem marcadores de lista nem espaços sobrando */
function lerNomes(txt) {
 const vistos = new Set(), existentes = new Set(membros().map(m => slug(m.nome)));
 return String(txt || '').split(/\r?\n/)
  .map(l => l.replace(/^\s*(?:[-*•–—]+|\d+\s*[.)\-–:]|\d+\s+)\s*/, '').replace(/\s+/g, ' ').trim())
  .filter(Boolean)
  .map(nome => {
   const k = slug(nome); let st = 'novo';
   if (vistos.has(k)) st = 'repetido'; else if (existentes.has(k)) st = 'existe';
   vistos.add(k); return {nome, st};
  });
}

function extrasItens() {
 if (flt != 'todas' && flt != 'extra') return [];
 return EXTRAS_FIXOS.filter(x => !fixoCfg(x.id).oc).map(x => {
   const r = x.resumo();
   return {n: x.n, t: 'extra', prog: /^0 /.test(r) ? 0 : 1, h: extraLinha(x.n, x.href, r)};
  })
  .concat(ACTS.filter(a => a.t == 'extra' && !a.oc).map(a => {

  }));
}

function ordenarMods(l) {
 const nome = (a, b) => a.n.localeCompare(b.n, 'pt-BR', {sensitivity: 'base'});
 const tipos = Object.keys(TN);
 const cmp = {
  az: nome,

 }[ordMod] || nome;
 return l.slice().sort(cmp);
}

const inscId = (mid, mod) => `${mid}__${mod}`;

  if (error) { fail(error); return null; } return data || [];
 },
 async daModalidade(mod, cat) {
  if (!db) return (S.insc || []).filter(x => x.mod === mod && +x.cat === +cat);
  const { data, error } = await db.from('inscricoes').select('*').eq('mod', mod).eq('cat', cat);
  if (error) { fail(error); return null; } return data || [];
 },
 async inscrever(lista) {
  const agora = new Date().toISOString();
  const rows = lista.map(x => ({id: inscId(x.membro, x.mod), membro: x.membro, mod: x.mod, cat: x.cat, presente: !!x.presente, partidas: x.partidas || [], updated_at: agora}));
  if (db) { const { error } = await db.from('inscricoes').upsert(rows); if (error) { fail(error); return false; } }
  else { const ids = new Set(rows.map(r => r.id)); S.insc = (S.insc || []).filter(x => !ids.has(x.id)).concat(rows); save(); }
  return true;
 },
 async remover(id) {
  if (db) { const { error } = await db.from('inscricoes').delete().eq('id', id); if (error) { fail(error); return false; } }
  else { S.insc = (S.insc || []).filter(x => x.id !== id); save(); }
  return true;
 },
 async presenca(id, v) {
  if (db) { const { error } = await db.from('inscricoes').update({presente: v, updated_at: new Date().toISOString()}).eq('id', id); if (error) { fail(error); return false; } }
  else { const x = (S.insc || []).find(y => y.id === id); if (x) x.presente = v; save(); }
  return true;
 },
 async apagarMod(mod) {
  if (db) { const { error } = await db.from('inscricoes').delete().eq('mod', mod); if (error) fail(error); }
  else { S.insc = (S.insc || []).filter(x => x.mod !== mod); save(); }
 },
 async mudarCat(mid, cat) {
  if (db) { const { error } = await db.from('inscricoes').update({cat}).eq('membro', mid); if (error) fail(error); }
  else { (S.insc || []).forEach(x => { if (x.membro === mid) x.cat = cat; }); save(); }
 }
};

   ========================================================================== */
/* Embaralhamento com o gerador aleatório criptográfico do navegador */
function embaralhar(l) {
 const a = l.slice();
 for (let i = a.length - 1; i > 0; i--) {
  const r = new Uint32Array(1); (window.crypto || {getRandomValues: x => { x[0] = Math.random() * 4294967296; return x; }}).getRandomValues(r);
  const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]];
 }
 return a;
}

/* Sorteia uma única vez: grava na hora no servidor e trava as equipes das semifinais */
async function sortearSemis(ci) {
 const key = rk(cur, ci);
 if (!await confirmar('Sortear as semifinais?\nO sorteio só pode ser feito uma vez. Depois dele, as equipes das semifinais ficam fixas.')) return;
 await DB.fetchSingleRes(cur, ci);   // confere se outro aparelho já sorteou
 if ((S.res[key] || {}).sorteio) { delete D[key]; sec(ci); avisar('As semifinais desta categoria já foram sorteadas.'); return; }
 const e = embaralhar(T);
 const d = clone(S.res[key] || {});
 d.m = {s1: {a: e[0], b: e[1]}, s2: {a: e[2], b: e[3]}};
 d.sorteio = {em: new Date().toISOString()};
 S.res[key] = d; delete D[key];
 await DB.persistRes(cur, ci);
 sec(ci);
}
const quandoSorteio = s => { try { return new Date(s.em).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}); } catch (e) { return ''; } };

/* Presença por partida: a inscrição guarda a lista de partidas em que o integrante esteve presente */
const presNa = (ins, x) => Array.isArray(ins.partidas) && ins.partidas.includes(x);
INSC.presencaPartida = async (ins, x, v) => {
 let atual = Array.isArray(ins.partidas) ? ins.partidas.slice() : [];
 if (db) {
  const { data, error } = await db.from('inscricoes').select('partidas').eq('id', ins.id);
  if (error) { fail(error); return null; }
  if (data && data.length && Array.isArray(data[0].partidas)) atual = data[0].partidas;
 }
 const nova = v ? [...new Set([...atual, x])] : atual.filter(p => p !== x);
 if (db) {
  const { error } = await db.from('inscricoes').update({partidas: nova, updated_at: new Date().toISOString()}).eq('id', ins.id);
  if (error) { fail(error); return null; }
 } else { const y = (S.insc || []).find(z => z.id === ins.id); if (y) y.partidas = nova; save(); }
 return nova;
};

/* ==========================================================================
   27. ANIMAÇÕES DA INTERFACE
   Camada só visual: envolve render() e loadingView() sem mudar nenhuma regra.
   - entrada suave ao trocar de página (não nas atualizações em tempo real);
   - placar geral: números contam, barras crescem e as equipes trocam de
     posição deslizando quando o placar muda;
   - placar das partidas: o número "pula" a cada + / −;
   - resultado salvo: a partida (ou a classificação) brilha em verde.
   ========================================================================== */
const semMov = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const EASE = 'cubic-bezier(.2,.8,.2,1)';
let pagAnim = null, entrouEm = 0, placarAnt = null;

/* Conta um número de "de" até "ate"; no fim mostra exatamente o texto original */
function contarAte(el, de, ate, atraso, dur) {
 const final = el.textContent, t0 = performance.now() + (atraso || 0), d = dur || 900;
 el.textContent = String(Math.round(de));
 const passo = now => {
  if (!document.contains(el)) return;
  const p = Math.min(1, Math.max(0, (now - t0) / d)), e = 1 - Math.pow(1 - p, 3);
  el.textContent = p < 1 ? String(Math.round(de + (ate - de) * e)) : final;
  if (p < 1) requestAnimationFrame(passo);
 };
 requestAnimationFrame(passo);
}

/* Placar geral: anima a partir do que estava na tela antes */
function animarPlacar(entrou) {
 const race = document.querySelector('#main .race');
 if (!race) { placarAnt = null; return; }
 const painel = race.closest('.panel'), reduz = semMov(), dt = performance.now() - entrouEm;
 const continuacao = !entrou && dt < 1200;   // o servidor respondeu enquanto a entrada ainda animava
 if (!reduz && (entrou || continuacao) && painel) {
  painel.classList.add('grow');
  if (continuacao) race.querySelectorAll('.bar').forEach((b, k) => { b.style.animationDelay = (k * 80 - dt) + 'ms'; });
 }
 const novo = {};
 [...race.querySelectorAll('.rrow')].forEach((r, k) => {
  const nome = r.querySelector('.rname').textContent, el = r.querySelector('.rpts'), bar = r.querySelector('.bar');
  const v = +el.textContent || 0, w = bar.style.width, top = r.offsetTop;
  novo[nome] = {v, w, top, el};
  if (reduz) return;
  if (entrou) { if (v) contarAte(el, 0, v, 250 + k * 90); return; }
  const ant = placarAnt && placarAnt[nome]; if (!ant) return;
  if (ant.top !== top && r.animate) r.animate([{transform: `translateY(${ant.top - top}px)`}, {transform: 'none'}], {duration: 600, easing: EASE});
  if (!continuacao && ant.w && ant.w !== w && bar.animate) bar.animate([{width: ant.w}, {width: w}], {duration: 800, easing: EASE});
  const de = continuacao ? (+ant.el.textContent || 0) : ant.v;
  if (de !== v) contarAte(el, de, v, 0, continuacao ? Math.max(250, 1150 - dt) : 900);
 });
 placarAnt = novo;
}

  entrouEm = performance.now();
  main.classList.remove('entrar');
